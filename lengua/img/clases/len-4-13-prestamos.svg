<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-label="Tres recuadros con palabras de otras lenguas (quechua y guaraní, italiano e inglés) que llegan con flechas al español de la Argentina." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<rect width="1000" height="500" fill="#fff"/>

