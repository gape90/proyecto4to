<text x="830" y="120" font-size="24" font-weight="700" fill="#1B1A4A" text-anchor="middle" >mouse · software</text><text x="830" y="156" font-size="24" font-weight="700" fill="#1B1A4A" text-anchor="middle" >chatear</text>
