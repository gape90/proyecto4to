<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="Esquema con la obra Antígona en el centro y cuatro recuadros alrededor, uno por cada pregunta del contexto de producción, con su respuesta." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<rect width="1000" height="560" fill="#fff"/>
<line x1="330" y1="170" x2="420" y2="240" stroke="#E2DAF6" stroke-width="6"/><line x1="670" y1="170" x2="580" y2="240" stroke="#E2DAF6" stroke-width="6"/><line x1="330" y1="390" x2="420" y2="320" stroke="#E2DAF6" stroke-width="6"/><line x1="670" y1="390" x2="580" y2="320" stroke="#E2DAF6" stroke-width="6"/>
<circle cx="500" cy="280" r="100" fill="#5B2A86"/><text x="500" y="272" font-size="32" font-weight="800" fill="#fff" text-anchor="middle" >Antígona</text><text x="500" y="306" font-size="22" font-weight="600" fill="#E2DAF6" text-anchor="middle" >Sófocles</text>
<rect x="20" y="20" width="320" height="180" rx="22" fill="#EFEAFB" stroke="#E2DAF6" stroke-width="3"/>
<text x="180" y="66" font-size="21" font-weight="800" fill="#B83A7A" text-anchor="middle" >¿Quién la escribió?</text>
<text x="180" y="132" font-size="22" font-weight="600" fill="#1B1A4A" text-anchor="middle" >Sófocles</text>
<rect x="660" y="20" width="320" height="180" rx="22" fill="#EFEAFB" stroke="#E2DAF6" stroke-width="3"/>
<text x="820" y="66" font-size="21" font-weight="800" fill="#B83A7A" text-anchor="middle" >¿Cuándo y dónde?</text>
<text x="820" y="116" font-size="22" font-weight="600" fill="#1B1A4A" text-anchor="middle" >En Atenas,</text><text x="820" y="145" font-size="22" font-weight="600" fill="#1B1A4A" text-anchor="middle" >en el siglo V a. C.</text>
<rect x="20" y="360" width="320" height="180" rx="22" fill="#EFEAFB" stroke="#E2DAF6" stroke-width="3"/>
<text x="180" y="406" font-size="19" font-weight="800" fill="#B83A7A" text-anchor="middle" >¿Qué pasaba en esa sociedad?</text>
<text x="180" y="456" font-size="22" font-weight="600" fill="#1B1A4A" text-anchor="middle" >Dejar a un muerto sin</text><text x="180" y="485" font-size="22" font-weight="600" fill="#1B1A4A" text-anchor="middle" >sepultura ofendía a los dioses</text>
<rect x="660" y="360" width="320" height="180" rx="22" fill="#EFEAFB" stroke="#E2DAF6" stroke-width="3"/>
<text x="820" y="406" font-size="21" font-weight="800" fill="#B83A7A" text-anchor="middle" >¿Cómo circulaba?</text>
<text x="820" y="456" font-size="22" font-weight="600" fill="#1B1A4A" text-anchor="middle" >Se representaba en teatros</text><text x="820" y="485" font-size="22" font-weight="600" fill="#1B1A4A" text-anchor="middle" >al aire libre, en festivales</text>
</svg>
