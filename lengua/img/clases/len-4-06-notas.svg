<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="Página de carpeta con notas sobre el texto de las abejas: un título subrayado, palabras clave resaltadas, flechas, una lista con viñetas y una idea clave encerrada en un recuadro." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
