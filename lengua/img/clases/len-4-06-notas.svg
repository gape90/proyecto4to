<text x="160" y="70" font-size="32" font-weight="700" fill="#4B4FA3" text-anchor="start" font-style="italic">Las abejas y los alimentos</text><line x1="160" y1="80" x2="560" y2="80" stroke="#4B4FA3" stroke-width="4"/>
<rect x="155" y="118" width="300" height="34" fill="#FFF2A8"/>
<text x="160" y="144" font-size="28" font-weight="600" fill="#1B1A4A" text-anchor="start" font-style="italic">abejas → polinización</text><text x="470" y="144" font-size="28" font-weight="600" fill="#1B1A4A" text-anchor="start" font-style="italic">→ frutos y semillas</text>
<text x="160" y="216" font-size="26" font-weight="600" fill="#4A4870" text-anchor="start" font-style="italic">muchos alimentos dependen de esto</text>
<text x="160" y="288" font-size="26" font-weight="600" fill="#1B1A4A" text-anchor="start" font-style="italic">están disminuyendo. ¿Por qué?</text>
<text x="200" y="324" font-size="26" font-weight="600" fill="#4A4870" text-anchor="start" font-style="italic">• algunos productos químicos</text><text x="200" y="360" font-size="26" font-weight="600" fill="#4A4870" text-anchor="start" font-style="italic">• pérdida del hábitat</text>
<text x="160" y="432" font-size="28" font-weight="700" fill="#E5194F" text-anchor="start" font-style="italic">cuidar abejas = cuidar alimentos</text><rect x="150" y="402" width="440" height="44" rx="10" fill="none" stroke="#E5194F" stroke-width="3"/>
<text x="640" y="432" font-size="24" font-weight="700" fill="#B83A7A" text-anchor="start" font-style="italic">← idea clave</text>
