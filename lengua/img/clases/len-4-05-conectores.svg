<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-label="Cinco filas, una por cada función de los conectores, con un ícono y dos conectores de ejemplo." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<rect width="1000" height="560" fill="#fff"/>
<rect x="20" y="20" width="960" height="92" rx="20" fill="#EFEAFB" stroke="#E2DAF6" stroke-width="3"/>
<circle cx="76" cy="66" r="32" fill="#4B4FA3"/><text x="76" y="78" font-size="34" font-weight="800" fill="#fff" text-anchor="middle" >+</text>
<text x="130" y="76" font-size="26" font-weight="800" fill="#1B1A4A" text-anchor="start" >Agregar una razón</text>
<rect x="560" y="38" width="400" height="56" rx="28" fill="#fff" stroke="#4B4FA3" stroke-width="3"/><text x="760" y="75" font-size="24" font-weight="700" fill="#4B4FA3" text-anchor="middle" >además · también</text>
<rect x="20" y="126" width="960" height="92" rx="20" fill="#EFEAFB" stroke="#E2DAF6" stroke-width="3"/>
<circle cx="76" cy="172" r="32" fill="#B83A7A"/><text x="76" y="184" font-size="34" font-weight="800" fill="#fff" text-anchor="middle" >≠</text>
<text x="130" y="182" font-size="26" font-weight="800" fill="#1B1A4A" text-anchor="start" >Oponer una idea</text>
<rect x="560" y="144" width="400" height="56" rx="28" fill="#fff" stroke="#B83A7A" stroke-width="3"/><text x="760" y="181" font-size="24" font-weight="700" fill="#B83A7A" text-anchor="middle" >pero · sin embargo</text>
<rect x="20" y="232" width="960" height="92" rx="20" fill="#EFEAFB" stroke="#E2DAF6" stroke-width="3"/>
<circle cx="76" cy="278" r="32" fill="#5B2A86"/><text x="76" y="290" font-size="34" font-weight="800" fill="#fff" text-anchor="middle" >?</text>
<text x="130" y="288" font-size="26" font-weight="800" fill="#1B1A4A" text-anchor="start" >Mostrar una causa</text>
<rect x="560" y="250" width="400" height="56" rx="28" fill="#fff" stroke="#5B2A86" stroke-width="3"/><text x="760" y="287" font-size="24" font-weight="700" fill="#5B2A86" text-anchor="middle" >porque · ya que</text>
<rect x="20" y="338" width="960" height="92" rx="20" fill="#EFEAFB" stroke="#E2DAF6" stroke-width="3"/>
<circle cx="76" cy="384" r="32" fill="#F0731E"/><text x="76" y="396" font-size="34" font-weight="800" fill="#fff" text-anchor="middle" >→</text>
<text x="130" y="394" font-size="26" font-weight="800" fill="#1B1A4A" text-anchor="start" >Mostrar una consecuencia</text>
<rect x="560" y="356" width="400" height="56" rx="28" fill="#fff" stroke="#F0731E" stroke-width="3"/><text x="760" y="393" font-size="24" font-weight="700" fill="#F0731E" text-anchor="middle" >por eso · por lo tanto</text>
<rect x="20" y="444" width="960" height="92" rx="20" fill="#EFEAFB" stroke="#E2DAF6" stroke-width="3"/>
<circle cx="76" cy="490" r="32" fill="#1F9D6B"/><text x="76" y="502" font-size="34" font-weight="800" fill="#fff" text-anchor="middle" >✓</text>
<text x="130" y="500" font-size="26" font-weight="800" fill="#1B1A4A" text-anchor="start" >Concluir</text>
<rect x="560" y="462" width="400" height="56" rx="28" fill="#fff" stroke="#1F9D6B" stroke-width="3"/><text x="760" y="499" font-size="24" font-weight="700" fill="#1F9D6B" text-anchor="middle" >en conclusión · en síntesis</text>
</svg>
