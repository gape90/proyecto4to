<text x="250" y="626" text-anchor="middle" font-size="20" font-weight="700" fill="#1B1A4A">Concluir</text>
<rect x="20" y="652" width="460" height="84" rx="12" fill="#EFEAFB" stroke="#4B4FA3" stroke-width="2" stroke-dasharray="7 6"/>
