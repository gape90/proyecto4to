<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 1039" role="img" aria-label="Árbol familiar de los personajes de Antígona" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<rect width="500" height="1039" fill="#FFFFFF"/>
<rect x="20" y="20" width="460" height="96" rx="18" fill="#E2DAF6" stroke="#5B2A86" stroke-width="3"/>
<text x="250" y="62" text-anchor="middle" font-size="28" font-weight="800" fill="#5B2A86">EDIPO</text>
<text x="250" y="98" text-anchor="middle" font-size="19" font-weight="600" fill="#4A4870">Antiguo rey de Tebas</text>
<path d="M36 116 V617.5 M36 224.5 H60 M36 355.5 H60 M36 486.5 H60 M36 617.5 H60" stroke="#5B2A86" stroke-width="3" fill="none"/>
<text x="110" y="150" text-anchor="middle" font-size="17" font-weight="700" fill="#5B2A86">sus hijos</text>
<rect x="60" y="166" width="420" height="117" rx="18" fill="#FFFFFF" stroke="#4B4FA3" stroke-width="3"/>
<rect x="74" y="180" width="392" height="54" rx="10" fill="#EFEAFB" stroke="#4B4FA3" stroke-width="2" stroke-dasharray="7 6"/>
<text x="270" y="264" text-anchor="middle" font-size="19" font-weight="600" fill="#4A4870">Hermano que defendió la ciudad</text>
<rect x="60" y="297" width="420" height="117" rx="18" fill="#FFFFFF" stroke="#4B4FA3" stroke-width="3"/>
<rect x="74" y="311" width="392" height="54" rx="10" fill="#EFEAFB" stroke="#4B4FA3" stroke-width="2" stroke-dasharray="7 6"/>
<text x="270" y="395" text-anchor="middle" font-size="19" font-weight="600" fill="#4A4870">Hermano considerado traidor</text>
<rect x="60" y="428" width="420" height="117" rx="18" fill="#FFFFFF" stroke="#4B4FA3" stroke-width="3"/>
<rect x="74" y="442" width="392" height="54" rx="10" fill="#EFEAFB" stroke="#4B4FA3" stroke-width="2" stroke-dasharray="7 6"/>
<text x="270" y="526" text-anchor="middle" font-size="19" font-weight="600" fill="#4A4870">Hermana que no se anima a ayudarla</text>
<rect x="60" y="559" width="420" height="117" rx="18" fill="#FFFFFF" stroke="#4B4FA3" stroke-width="3"/>
<rect x="74" y="573" width="392" height="54" rx="10" fill="#EFEAFB" stroke="#4B4FA3" stroke-width="2" stroke-dasharray="7 6"/>
<text x="270" y="657" text-anchor="middle" font-size="19" font-weight="600" fill="#4A4870">Hermana que entierra a su hermano</text>
<rect x="20" y="710" width="460" height="117" rx="18" fill="#FFFFFF" stroke="#4B4FA3" stroke-width="3"/>
<rect x="34" y="724" width="432" height="54" rx="10" fill="#EFEAFB" stroke="#4B4FA3" stroke-width="2" stroke-dasharray="7 6"/>
<text x="250" y="808" text-anchor="middle" font-size="19" font-weight="600" fill="#4A4870">Nuevo rey de Tebas, tío de Antígona</text>
<path d="M250 827 V877" stroke="#4B4FA3" stroke-width="3"/>
<text x="300" y="859" text-anchor="middle" font-size="17" font-weight="700" fill="#4B4FA3">su hijo</text>
<rect x="20" y="877" width="460" height="142" rx="18" fill="#FFFFFF" stroke="#4B4FA3" stroke-width="3"/>
<rect x="34" y="891" width="432" height="54" rx="10" fill="#EFEAFB" stroke="#4B4FA3" stroke-width="2" stroke-dasharray="7 6"/>
<text x="250" y="975" text-anchor="middle" font-size="19" font-weight="600" fill="#4A4870">Hijo de Creonte,</text><text x="250" y="1000" text-anchor="middle" font-size="19" font-weight="600" fill="#4A4870">prometido de Antígona</text>
</svg>
