<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="Línea de tiempo con el relato de Ana: una franja de fondo con los verbos en imperfecto, un punto anterior con el pluscuamperfecto y otro punto con los verbos en perfecto simple." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<rect width="1000" height="470" fill="#fff"/>
<rect x="20" y="150" width="960" height="70" rx="16" fill="#EFEAFB" stroke="#E2DAF6" stroke-width="3"/><text x="500" y="182" font-size="24" font-weight="800" fill="#5B2A86" text-anchor="middle" >era · llovía</text><text x="500" y="208" font-size="19" font-weight="600" fill="#4A4870" text-anchor="middle" >Imperfecto: el fondo</text>

<line class="tp-linea" pathLength="1" x1="40" y1="300" x2="940" y2="300" stroke="#4A4870" stroke-width="6"/><path class="tp-fl" d="M940 286 L972 300 L940 314Z" fill="#4A4870"/>
<g class="tp-a"><circle cx="250" cy="300" r="20" fill="#B83A7A"/><text x="250" y="270" font-size="26" font-weight="800" fill="#B83A7A" text-anchor="middle" >se había ido</text><text x="250" y="360" font-size="20" font-weight="700" fill="#1B1A4A" text-anchor="middle" >Pluscuamperfecto:</text><text x="250" y="386" font-size="20" font-weight="600" fill="#1B1A4A" text-anchor="middle" >algo anterior</text></g>
<g class="tp-b"><circle cx="700" cy="300" r="20" fill="#4B4FA3"/><text x="700" y="270" font-size="26" font-weight="800" fill="#4B4FA3" text-anchor="middle" >sonó · abrió</text><text x="700" y="360" font-size="20" font-weight="700" fill="#1B1A4A" text-anchor="middle" >Perfecto simple:</text><text x="700" y="386" font-size="20" font-weight="600" fill="#1B1A4A" text-anchor="middle" >las acciones</text></g>
<text x="40" y="446" font-size="22" font-weight="700" fill="#4A4870" text-anchor="start" >← antes</text><text x="960" y="446" font-size="22" font-weight="700" fill="#4A4870" text-anchor="end" >después →</text>
<text x="500" y="80" font-size="22" font-weight="600" fill="#1B1A4A" text-anchor="middle" >&quot;Era una noche fría y llovía sin parar. De pronto, sonó el timbre</text><text x="500" y="112" font-size="22" font-weight="600" fill="#1B1A4A" text-anchor="middle" >y Ana abrió la puerta. Nadie estaba ahí: el visitante ya se había ido.&quot;</text>
</svg>
