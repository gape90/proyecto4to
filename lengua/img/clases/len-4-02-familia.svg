<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="Árbol familiar de los personajes de Antígona" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<rect width="1000" height="440" fill="#FFFFFF"/>
<rect x="235" y="20" width="260" height="104" rx="18" fill="#E2DAF6" stroke="#5B2A86" stroke-width="3"/>
<text x="365" y="64" text-anchor="middle" font-size="28" font-weight="800" fill="#5B2A86">EDIPO</text>
<text x="365" y="100" text-anchor="middle" font-size="18" font-weight="600" fill="#4A4870">Antiguo rey de Tebas</text>
<path d="M365 124 V196 M102.5 196 H627.5 M102.5 196 V240 M277.5 196 V240 M452.5 196 V240 M627.5 196 V240" stroke="#5B2A86" stroke-width="3" fill="none"/>
<text x="560" y="186" text-anchor="middle" font-size="15" font-weight="700" fill="#5B2A86">sus hijos</text>
<rect x="20" y="240" width="165" height="180" rx="18" fill="#FFFFFF" stroke="#4B4FA3" stroke-width="3"/>
<rect x="30" y="254" width="145" height="54" rx="10" fill="#EFEAFB" stroke="#4B4FA3" stroke-width="2" stroke-dasharray="7 6"/>
<text x="102.5" y="342" text-anchor="middle" font-size="17" font-weight="600" fill="#4A4870">Hermano que</text><text x="102.5" y="365" text-anchor="middle" font-size="17" font-weight="600" fill="#4A4870">defendió</text><text x="102.5" y="388" text-anchor="middle" font-size="17" font-weight="600" fill="#4A4870">la ciudad</text>
<rect x="195" y="240" width="165" height="180" rx="18" fill="#FFFFFF" stroke="#4B4FA3" stroke-width="3"/>
<rect x="205" y="254" width="145" height="54" rx="10" fill="#EFEAFB" stroke="#4B4FA3" stroke-width="2" stroke-dasharray="7 6"/>
<text x="277.5" y="342" text-anchor="middle" font-size="17" font-weight="600" fill="#4A4870">Hermano</text><text x="277.5" y="365" text-anchor="middle" font-size="17" font-weight="600" fill="#4A4870">considerado</text><text x="277.5" y="388" text-anchor="middle" font-size="17" font-weight="600" fill="#4A4870">traidor</text>
<rect x="370" y="240" width="165" height="180" rx="18" fill="#FFFFFF" stroke="#4B4FA3" stroke-width="3"/>
<rect x="380" y="254" width="145" height="54" rx="10" fill="#EFEAFB" stroke="#4B4FA3" stroke-width="2" stroke-dasharray="7 6"/>
<text x="452.5" y="342" text-anchor="middle" font-size="17" font-weight="600" fill="#4A4870">Hermana que</text><text x="452.5" y="365" text-anchor="middle" font-size="17" font-weight="600" fill="#4A4870">no se anima</text><text x="452.5" y="388" text-anchor="middle" font-size="17" font-weight="600" fill="#4A4870">a ayudarla</text>
<rect x="545" y="240" width="165" height="180" rx="18" fill="#FFFFFF" stroke="#4B4FA3" stroke-width="3"/>
<rect x="555" y="254" width="145" height="54" rx="10" fill="#EFEAFB" stroke="#4B4FA3" stroke-width="2" stroke-dasharray="7 6"/>
<text x="627.5" y="342" text-anchor="middle" font-size="17" font-weight="600" fill="#4A4870">Hermana que</text><text x="627.5" y="365" text-anchor="middle" font-size="17" font-weight="600" fill="#4A4870">entierra a</text><text x="627.5" y="388" text-anchor="middle" font-size="17" font-weight="600" fill="#4A4870">su hermano</text>
<rect x="760" y="20" width="220" height="150" rx="18" fill="#FFFFFF" stroke="#4B4FA3" stroke-width="3"/>
<rect x="772" y="32" width="196" height="54" rx="10" fill="#EFEAFB" stroke="#4B4FA3" stroke-width="2" stroke-dasharray="7 6"/>
<text x="870" y="116" text-anchor="middle" font-size="17" font-weight="600" fill="#4A4870">Nuevo rey de Tebas,</text><text x="870" y="139" text-anchor="middle" font-size="17" font-weight="600" fill="#4A4870">tío de Antígona</text>
<path d="M890 170 V240" stroke="#4B4FA3" stroke-width="3"/>
<text x="926" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#4B4FA3">su hijo</text>
<rect x="800" y="240" width="180" height="180" rx="18" fill="#FFFFFF" stroke="#4B4FA3" stroke-width="3"/>
<rect x="810" y="254" width="160" height="54" rx="10" fill="#EFEAFB" stroke="#4B4FA3" stroke-width="2" stroke-dasharray="7 6"/>
<text x="890" y="342" text-anchor="middle" font-size="17" font-weight="600" fill="#4A4870">Hijo de Creonte,</text><text x="890" y="365" text-anchor="middle" font-size="17" font-weight="600" fill="#4A4870">prometido de</text><text x="890" y="388" text-anchor="middle" font-size="17" font-weight="600" fill="#4A4870">Antígona</text>
<path d="M715 330 H795" stroke="#5B2A86" stroke-width="3" stroke-dasharray="8 6"/>
<text x="755" y="318" text-anchor="middle" font-size="14" font-weight="700" fill="#5B2A86">prometidos</text>
</svg>
