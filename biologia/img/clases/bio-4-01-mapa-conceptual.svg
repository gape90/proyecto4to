<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="Mapa conceptual. Los seres vivos están formados por bioelementos. Los bioelementos se combinan y forman biomoléculas. Las biomoléculas pueden ser inorgánicas, que son el agua y las sales minerales, u orgánicas, que tienen carbono y son los glúcidos, los lípidos, las proteínas y los ácidos nucleicos." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<defs><marker id="mc-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#5B2A86"/></marker></defs>
<rect x="0" y="0" width="1000" height="620" rx="28" fill="#F7F4FD"/>
<g class="a-ap" style="--d:0.0s"><rect x="350" y="20" width="300" height="66" rx="20" fill="#5B2A86" stroke="#5B2A86" stroke-width="4"/>
<text x="500.0" y="60.9" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">Los seres vivos</text></g>
<g class="a-ap" style="--d:0.5s"><path d="M500 88 L500 148" stroke="#5B2A86" stroke-width="4" fill="none" marker-end="url(#mc-p)"/><text x="520" y="124" font-size="17" font-weight="700" fill="#5B2A86" text-anchor="start">están formados por</text></g>
<g class="a-ap" style="--d:0.9s"><rect x="280" y="152" width="440" height="92" rx="20" fill="#fff" stroke="#4B4FA3" stroke-width="4"/>
<text x="500.0" y="182.1" font-size="21" font-weight="800" fill="#4B4FA3" text-anchor="middle">Bioelementos</text>
<text x="500.0" y="212.3" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">Principales, secundarios y</text>
<text x="500.0" y="233.1" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">oligoelementos</text></g>
<g class="a-ap" style="--d:1.5s"><path d="M500 246 L500 306" stroke="#5B2A86" stroke-width="4" fill="none" marker-end="url(#mc-p)"/><text x="520" y="282" font-size="17" font-weight="700" fill="#5B2A86" text-anchor="start">se combinan y forman</text></g>
<g class="a-ap" style="--d:1.9s"><rect x="340" y="310" width="320" height="66" rx="20" fill="#fff" stroke="#B83A7A" stroke-width="4"/>
<text x="500.0" y="350.9" font-size="21" font-weight="800" fill="#B83A7A" text-anchor="middle">Biomoléculas</text></g>
<g class="a-ap" style="--d:2.5s"><path d="M430 378 Q330 400 250 438" stroke="#5B2A86" stroke-width="4" fill="none" marker-end="url(#mc-p)"/><path d="M570 378 Q670 400 750 438" stroke="#5B2A86" stroke-width="4" fill="none" marker-end="url(#mc-p)"/><text x="500" y="412" font-size="17" font-weight="700" fill="#5B2A86" text-anchor="middle">pueden ser</text></g>
<g class="a-ap" style="--d:3.0s"><rect x="60" y="442" width="380" height="156" rx="20" fill="#fff" stroke="#4B4FA3" stroke-width="4"/>
<text x="250.0" y="482" font-size="21" font-weight="800" fill="#4B4FA3" text-anchor="middle">Inorgánicas</text>
<text x="250.0" y="524" font-size="19" font-weight="700" fill="#4A4870" text-anchor="middle">Agua</text>
<text x="250.0" y="554" font-size="19" font-weight="700" fill="#4A4870" text-anchor="middle">Sales minerales</text></g>
<g class="a-ap" style="--d:3.6s"><rect x="560" y="442" width="380" height="156" rx="20" fill="#fff" stroke="#E5194F" stroke-width="4"/>
<text x="750.0" y="482" font-size="21" font-weight="800" fill="#E5194F" text-anchor="middle">Orgánicas (tienen carbono)</text>
<text x="662.6" y="528" font-size="19" font-weight="700" fill="#4A4870" text-anchor="middle">Glúcidos</text>
<text x="837.4" y="528" font-size="19" font-weight="700" fill="#4A4870" text-anchor="middle">Lípidos</text>
<text x="662.6" y="562" font-size="19" font-weight="700" fill="#4A4870" text-anchor="middle">Proteínas</text>
<text x="837.4" y="562" font-size="19" font-weight="700" fill="#4A4870" text-anchor="middle">Ácidos nucleicos</text></g>
</svg>
