<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-label="Esquema en cadena. El hipotálamo, en el encéfalo, envía una orden a la hipófisis. La hipófisis libera una hormona que estimula la tiroides. La tiroides fabrica hormonas tiroideas, que viajan por la sangre hasta los órganos: en una persona regulan el uso de la energía; en un renacuajo, desencadenan la metamorfosis. Una flecha punteada vuelve desde las hormonas tiroideas hacia el hipotálamo y la hipófisis: cuando hay suficiente cantidad, frenan la orden." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<defs><radialGradient id="ej-fondo" cx=".5" cy=".4" r=".75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#F1ECFA"/></radialGradient><linearGradient id="ej-piel" x1="0" x2="1"><stop offset="0" stop-color="#FCEADF"/><stop offset="1" stop-color="#F3D2BF"/></linearGradient><filter id="ej-som" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2B1F4A" flood-opacity=".14"/></filter><filter id="ej-brillo" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter><marker id="ej-f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1B1A4A"/></marker><marker id="ej-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#B83A7A"/></marker></defs>
<rect x="0" y="0" width="1000" height="440" rx="28" fill="#F7F4FD"/>
<g class="a-ap" style="--d:0s"><rect width="1000" height="440" rx="26" fill="url(#ej-fondo)"/></g>
<g class="a-ap" style="--d:0.2s"><rect x="30" y="85" width="200" height="160" rx="20" fill="#fff" stroke="#7A3FB0" stroke-width="4"/>
<text x="130.0" y="150.4" font-size="21" font-weight="800" fill="#7A3FB0" text-anchor="middle">Hipotálamo</text>
<text x="130.0" y="180.6" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">en el encéfalo: da la</text>
<text x="130.0" y="200.1" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">orden</text></g>
<g class="a-ap" style="--d:0.35s"><path d="M234 165.0 L270 165.0" stroke="#1B1A4A" stroke-width="4" marker-end="url(#ej-f)"/></g>
<g class="a-ap" style="--d:0.5s"><rect x="276" y="85" width="200" height="160" rx="20" fill="#fff" stroke="#7A3FB0" stroke-width="4"/>
<text x="376.0" y="150.4" font-size="21" font-weight="800" fill="#7A3FB0" text-anchor="middle">Hipófisis</text>
<text x="376.0" y="180.6" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">libera una hormona que</text>
<text x="376.0" y="200.1" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">estimula la tiroides</text></g>
<g class="a-ap" style="--d:0.6499999999999999s"><path d="M480 165.0 L516 165.0" stroke="#1B1A4A" stroke-width="4" marker-end="url(#ej-f)"/></g>
<g class="a-ap" style="--d:0.8s"><rect x="522" y="85" width="200" height="160" rx="20" fill="#fff" stroke="#D64A7E" stroke-width="4"/>
<text x="622.0" y="150.4" font-size="21" font-weight="800" fill="#D64A7E" text-anchor="middle">Tiroides</text>
<text x="622.0" y="180.6" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">fabrica hormonas</text>
<text x="622.0" y="200.1" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">tiroideas</text></g>
<g class="a-ap" style="--d:0.95s"><path d="M726 165.0 L762 165.0" stroke="#1B1A4A" stroke-width="4" marker-end="url(#ej-f)"/></g>
<g class="a-ap" style="--d:1.0999999999999999s"><rect x="768" y="85" width="200" height="160" rx="20" fill="#fff" stroke="#1F9D6B" stroke-width="4"/>
<text x="868.0" y="121.1" font-size="21" font-weight="800" fill="#1F9D6B" text-anchor="middle">Órganos</text>
<text x="868.0" y="151.4" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">reciben las hormonas</text>
<text x="868.0" y="170.9" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">por la sangre.</text>
<text x="868.0" y="190.4" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">Persona: uso de la</text>
<text x="868.0" y="209.9" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">energía. Renacuajo:</text>
<text x="868.0" y="229.4" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">metamorfosis</text></g>
<g class="a-ap" style="--d:1.3s"><path d="M622.0 253 L622.0 315 L190.0 315 L190.0 255" fill="none" stroke="#B83A7A" stroke-width="3.5" stroke-dasharray="9 7" marker-end="url(#ej-r)"/><path d="M436.0 315 L436.0 255" fill="none" stroke="#B83A7A" stroke-width="3.5" stroke-dasharray="9 7" marker-end="url(#ej-r)"/><text x="466.0" y="349" font-size="18" font-weight="800" fill="#B83A7A" text-anchor="middle">Cuando hay suficientes hormonas tiroideas, frenan la orden</text><text x="466.0" y="373" font-size="16" font-weight="700" fill="#4A4870" text-anchor="middle">(retroalimentación negativa)</text></g>
</svg>
