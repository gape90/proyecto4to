<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 634" role="img" aria-label="Dibujo en dos columnas. A la izquierda, la sangre que llega al riñón: lleva agua, sales, glucosa y urea. A la derecha, lo que sale del riñón por dos caminos: por la vena, la sangre limpia, con agua, sales y glucosa, y sin urea; por el uréter, la orina, con urea, agua y las sales que sobran." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<defs><marker id="rn-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#C62828"/></marker><marker id="rn-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1E5AA8"/></marker><marker id="rn-u" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#B08A00"/></marker></defs>
<rect x="0" y="0" width="520" height="634" rx="28" fill="#F7F4FD"/>
<g class="a-ap" style="--d:0.0s"><text x="260" y="34" font-size="21" font-weight="800" fill="#5B2A86" text-anchor="middle">Antes: la sangre que llega</text></g>
<g class="a-ap" style="--d:0.2s"><rect x="60" y="52" width="400" height="104" rx="18" fill="#FDECEC" stroke="#C62828" stroke-width="2.5"/><circle cx="96" cy="84" r="11" fill="#4FA3E0" stroke="#fff" stroke-width="2.5"/><text x="118" y="90" font-size="18" font-weight="700" fill="#1B1A4A" text-anchor="start">Agua</text><circle cx="96" cy="124" r="11" fill="#9AA0B4" stroke="#fff" stroke-width="2.5"/><text x="118" y="130" font-size="18" font-weight="700" fill="#1B1A4A" text-anchor="start">Sales</text><circle cx="286" cy="84" r="11" fill="#F0731E" stroke="#fff" stroke-width="2.5"/><text x="308" y="90" font-size="18" font-weight="700" fill="#1B1A4A" text-anchor="start">Glucosa</text><circle cx="286" cy="124" r="11" fill="#C9A400" stroke="#fff" stroke-width="2.5"/><text x="308" y="130" font-size="18" font-weight="700" fill="#1B1A4A" text-anchor="start">Urea</text></g>
<g class="a-ap" style="--d:0.5s"><path d="M260 158 L260 196" stroke="#C62828" stroke-width="6" marker-end="url(#rn-r)"/><text x="274" y="186" font-size="17" font-weight="700" fill="#C62828" text-anchor="start">arteria</text></g>
