<g class="a-ap" style="--d:1.4s"><rect x="12" y="452" width="240" height="170" rx="18" fill="#EAF1FB" stroke="#1E5AA8" stroke-width="2.5"/><text x="132" y="482" font-size="19" font-weight="800" fill="#1E5AA8" text-anchor="middle">Sangre limpia</text><circle cx="36" cy="514" r="11" fill="#4FA3E0" stroke="#fff" stroke-width="2.5"/><text x="58" y="520" font-size="18" font-weight="700" fill="#1B1A4A" text-anchor="start">Agua</text><circle cx="36" cy="554" r="11" fill="#9AA0B4" stroke="#fff" stroke-width="2.5"/><text x="58" y="560" font-size="18" font-weight="700" fill="#1B1A4A" text-anchor="start">Sales</text><circle cx="36" cy="594" r="11" fill="#F0731E" stroke="#fff" stroke-width="2.5"/><text x="58" y="600" font-size="18" font-weight="700" fill="#1B1A4A" text-anchor="start">Glucosa</text></g>
