<g class="a-ap" style="--d:1.0s"><path d="M230 380 Q160 410 140 440" stroke="#1E5AA8" stroke-width="6" fill="none" marker-end="url(#rn-a)"/><text x="150" y="410" font-size="17" font-weight="700" fill="#1E5AA8" text-anchor="end">vena</text></g>
