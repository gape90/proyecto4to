<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 760" role="img" aria-label="Mapa conceptual. Los seres vivos están formados por bioelementos. Los bioelementos se combinan y forman biomoléculas. Las biomoléculas pueden ser inorgánicas, que son el agua y las sales minerales, u orgánicas, que tienen carbono y son los glúcidos, los lípidos, las proteínas y los ácidos nucleicos." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<defs><marker id="mc-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#5B2A86"/></marker></defs>
<rect x="0" y="0" width="520" height="760" rx="28" fill="#F7F4FD"/>
<g class="a-ap" style="--d:0.0s"><rect x="110" y="16" width="300" height="62" rx="20" fill="#5B2A86" stroke="#5B2A86" stroke-width="4"/>
<text x="260.0" y="54.9" font-size="21" font-weight="800" fill="#fff" text-anchor="middle">Los seres vivos</text></g>
<g class="a-ap" style="--d:0.5s"><path d="M260 80 L260 128" stroke="#5B2A86" stroke-width="4" fill="none" marker-end="url(#mc-p)"/><text x="280" y="110" font-size="16" font-weight="700" fill="#5B2A86" text-anchor="start">están formados por</text></g>
<g class="a-ap" style="--d:0.9s"><rect x="50" y="132" width="420" height="90" rx="20" fill="#fff" stroke="#4B4FA3" stroke-width="4"/>
<text x="260.0" y="161.1" font-size="21" font-weight="800" fill="#4B4FA3" text-anchor="middle">Bioelementos</text>
<text x="260.0" y="191.3" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">Principales, secundarios y</text>
<text x="260.0" y="212.1" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">oligoelementos</text></g>
<g class="a-ap" style="--d:1.5s"><path d="M260 224 L260 272" stroke="#5B2A86" stroke-width="4" fill="none" marker-end="url(#mc-p)"/><text x="280" y="254" font-size="16" font-weight="700" fill="#5B2A86" text-anchor="start">se combinan y forman</text></g>
<g class="a-ap" style="--d:1.9s"><rect x="110" y="276" width="300" height="62" rx="20" fill="#fff" stroke="#B83A7A" stroke-width="4"/>
<text x="260.0" y="314.9" font-size="21" font-weight="800" fill="#B83A7A" text-anchor="middle">Biomoléculas</text></g>
<g class="a-ap" style="--d:2.5s"><path d="M260 340 L260 392" stroke="#5B2A86" stroke-width="4" fill="none" marker-end="url(#mc-p)"/><text x="280" y="384" font-size="16" font-weight="700" fill="#5B2A86" text-anchor="start">pueden ser</text></g>
<g class="a-ap" style="--d:3.0s"><rect x="40" y="396" width="440" height="130" rx="20" fill="#fff" stroke="#4B4FA3" stroke-width="4"/>
<text x="260.0" y="436" font-size="21" font-weight="800" fill="#4B4FA3" text-anchor="middle">Inorgánicas</text>
<text x="260.0" y="478" font-size="19" font-weight="700" fill="#4A4870" text-anchor="middle">Agua</text>
<text x="260.0" y="508" font-size="19" font-weight="700" fill="#4A4870" text-anchor="middle">Sales minerales</text></g>
<g class="a-ap" style="--d:3.4s"><path d="M260 358 L24 358 Q14 358 14 368 L14 640 Q14 650 24 650 L38 650" stroke="#5B2A86" stroke-width="4" fill="none" marker-end="url(#mc-p)"/></g>
<g class="a-ap" style="--d:3.8s"><rect x="40" y="546" width="440" height="190" rx="20" fill="#fff" stroke="#E5194F" stroke-width="4"/>
<text x="260.0" y="586" font-size="21" font-weight="800" fill="#E5194F" text-anchor="middle">Orgánicas (tienen carbono)</text>
<text x="260.0" y="628" font-size="19" font-weight="700" fill="#4A4870" text-anchor="middle">Glúcidos</text>
<text x="260.0" y="658" font-size="19" font-weight="700" fill="#4A4870" text-anchor="middle">Lípidos</text>
<text x="260.0" y="688" font-size="19" font-weight="700" fill="#4A4870" text-anchor="middle">Proteínas</text>
<text x="260.0" y="718" font-size="19" font-weight="700" fill="#4A4870" text-anchor="middle">Ácidos nucleicos</text></g>
</svg>
