<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 962" role="img" aria-label="Ilustración en dos columnas. A la izquierda, los autótrofos: una planta con raíces en la tierra recibe la luz del sol, toma agua y sales minerales del suelo y dióxido de carbono del aire, fabrica su propia materia orgánica por fotosíntesis y libera oxígeno. A la derecha, los heterótrofos toman la materia orgánica de otros seres vivos: un conejo que come una hoja y la digiere adentro de su cuerpo, y un hongo sobre un tronco, que la digiere afuera y la absorbe. Una flecha muestra que la materia orgánica que fabrican los autótrofos pasa a los heterótrofos." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
