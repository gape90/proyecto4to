<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Ilustración de una articulación móvil, como la rodilla, en corte. Los extremos de los dos huesos están cubiertos de cartílago. Entre ellos hay una cavidad con líquido sinovial, cerrada por una envoltura. Por fuera, los ligamentos unen un hueso con el otro." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
