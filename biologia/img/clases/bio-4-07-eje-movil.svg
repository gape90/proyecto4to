<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 700" role="img" aria-label="Esquema en cadena. El hipotálamo, en el encéfalo, envía una orden a la hipófisis. La hipófisis libera una hormona que estimula la tiroides. La tiroides fabrica hormonas tiroideas, que viajan por la sangre hasta los órganos: en una persona regulan el uso de la energía; en un renacuajo, desencadenan la metamorfosis. Una flecha punteada vuelve desde las hormonas tiroideas hacia el hipotálamo y la hipófisis: cuando hay suficiente cantidad, frenan la orden." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<defs><radialGradient id="ej-fondo" cx=".5" cy=".4" r=".75"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#F1ECFA"/></radialGradient><linearGradient id="ej-piel" x1="0" x2="1"><stop offset="0" stop-color="#FCEADF"/><stop offset="1" stop-color="#F3D2BF"/></linearGradient><filter id="ej-som" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#2B1F4A" flood-opacity=".14"/></filter><filter id="ej-brillo" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter><marker id="ej-f" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1B1A4A"/></marker><marker id="ej-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#B83A7A"/></marker></defs>
<rect x="0" y="0" width="520" height="700" rx="28" fill="#F7F4FD"/>
<g class="a-ap" style="--d:0s"><rect width="520" height="700" rx="24" fill="url(#ej-fondo)"/></g>
<g class="a-ap" style="--d:0.2s"><rect x="40" y="30" width="330" height="128" rx="20" fill="#fff" stroke="#7A3FB0" stroke-width="4"/>
<text x="205.0" y="88.8" font-size="22" font-weight="800" fill="#7A3FB0" text-anchor="middle">Hipotálamo</text>
<text x="205.0" y="120.3" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">en el encéfalo: da la orden</text></g>
<g class="a-ap" style="--d:0.35s"><path d="M205.0 162 L205.0 192" stroke="#1B1A4A" stroke-width="4" marker-end="url(#ej-f)"/></g>
<g class="a-ap" style="--d:0.5s"><rect x="40" y="198" width="330" height="128" rx="20" fill="#fff" stroke="#7A3FB0" stroke-width="4"/>
<text x="205.0" y="246.4" font-size="22" font-weight="800" fill="#7A3FB0" text-anchor="middle">Hipófisis</text>
<text x="205.0" y="277.9" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">libera una hormona que</text>
<text x="205.0" y="298.8" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">estimula la tiroides</text></g>
<g class="a-ap" style="--d:0.6499999999999999s"><path d="M205.0 330 L205.0 360" stroke="#1B1A4A" stroke-width="4" marker-end="url(#ej-f)"/></g>
<g class="a-ap" style="--d:0.8s"><rect x="40" y="366" width="330" height="128" rx="20" fill="#fff" stroke="#D64A7E" stroke-width="4"/>
<text x="205.0" y="424.9" font-size="22" font-weight="800" fill="#D64A7E" text-anchor="middle">Tiroides</text>
<text x="205.0" y="456.4" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">fabrica hormonas tiroideas</text></g>
<g class="a-ap" style="--d:0.95s"><path d="M205.0 498 L205.0 528" stroke="#1B1A4A" stroke-width="4" marker-end="url(#ej-f)"/></g>
<g class="a-ap" style="--d:1.0999999999999999s"><rect x="40" y="534" width="330" height="128" rx="20" fill="#fff" stroke="#1F9D6B" stroke-width="4"/>
<text x="205.0" y="561.6" font-size="22" font-weight="800" fill="#1F9D6B" text-anchor="middle">Órganos</text>
<text x="205.0" y="593.1" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">reciben las hormonas por la</text>
<text x="205.0" y="613.9" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">sangre. Persona: uso de la</text>
<text x="205.0" y="634.7" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">energía. Renacuajo:</text>
<text x="205.0" y="655.5" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">metamorfosis</text></g>
<g class="a-ap" style="--d:1.3s"><path d="M376 430.0 L420 430.0 L420 94.0 L378 94.0" fill="none" stroke="#B83A7A" stroke-width="3.5" stroke-dasharray="9 7" marker-end="url(#ej-r)"/><path d="M420 262.0 L378 262.0" fill="none" stroke="#B83A7A" stroke-width="3.5" stroke-dasharray="9 7" marker-end="url(#ej-r)"/><text x="446" y="262.0" font-size="15" font-weight="800" fill="#B83A7A" text-anchor="middle" transform="rotate(90 446 262.0)">Cuando hay suficientes, frenan la orden</text></g>
</svg>
