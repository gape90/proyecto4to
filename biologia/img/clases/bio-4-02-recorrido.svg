<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="Esquema del recorrido de un alimento. Primero, la alimentación, fuera del cuerpo y voluntaria: elegir y preparar, y comer. Después, la nutrición, que empieza en la boca y es casi toda involuntaria: digestión en el sistema digestivo; transporte de los nutrientes por la sangre, con el sistema circulatorio; uso en las células, con el oxígeno del sistema respiratorio; y eliminación de los desechos por el sistema excretor." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<defs><marker id="rc-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#F0731E"/></marker><marker id="rc-n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#5B2A86"/></marker></defs>
<rect x="0" y="0" width="1000" height="470" rx="28" fill="#F7F4FD"/>
<rect x="24" y="20" width="290" height="400" rx="22" fill="#FFF4EA" stroke="#F0731E" stroke-width="3"/>
<text x="169" y="58" font-size="26" font-weight="800" fill="#F0731E" text-anchor="middle">Alimentación</text>
<text x="169" y="84" font-size="16" font-weight="700" fill="#4A4870" text-anchor="middle">Fuera del cuerpo · voluntaria</text>
<rect x="340" y="20" width="636" height="400" rx="22" fill="#F1EEFB" stroke="#5B2A86" stroke-width="3"/>
<text x="658" y="58" font-size="26" font-weight="800" fill="#5B2A86" text-anchor="middle">Nutrición</text>
<text x="658" y="84" font-size="16" font-weight="700" fill="#4A4870" text-anchor="middle">Desde la boca · casi toda involuntaria</text>
<g class="a-ap" style="--d:0.0s"><g><rect x="48" y="110" width="242" height="132" rx="16" fill="#fff" stroke="#F0731E" stroke-width="3"/>
<text x="169.0" y="142" font-size="20" font-weight="800" fill="#F0731E" text-anchor="middle">1. Elegir y preparar</text>
<text x="169.0" y="168" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">Qué comer, cómo cocinarlo,</text>
<text x="169.0" y="188.8" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">con quién.</text></g></g>
<g class="a-ap" style="--d:0.3s"><path d="M169 242 L169 264" stroke="#F0731E" stroke-width="4" marker-end="url(#rc-a)"/></g>
<g class="a-ap" style="--d:0.6s"><g><rect x="48" y="268" width="242" height="132" rx="16" fill="#fff" stroke="#F0731E" stroke-width="3"/>
<text x="169.0" y="300" font-size="20" font-weight="800" fill="#F0731E" text-anchor="middle">2. Comer</text>
<text x="169.0" y="326" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">Llevar el alimento a la</text>
<text x="169.0" y="346.8" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">boca.</text></g></g>
<g class="a-ap" style="--d:0.9s"><path d="M290 333 Q330 333 330 250 Q330 175 356 175" fill="none" stroke="#5B2A86" stroke-width="4" marker-end="url(#rc-n)"/></g>
<g class="a-ap" style="--d:1.2s"><g><rect x="364" y="110" width="284" height="132" rx="16" fill="#fff" stroke="#4B4FA3" stroke-width="3"/>
<text x="506.0" y="142" font-size="20" font-weight="800" fill="#4B4FA3" text-anchor="middle">3. Digestión</text>
<text x="506.0" y="168" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">El sistema digestivo parte los</text>
<text x="506.0" y="188.8" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">nutrientes en unidades más</text>
<text x="506.0" y="209.6" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">chicas.</text></g></g>
<g class="a-ap" style="--d:1.5s"><path d="M650 175 L672 175" stroke="#5B2A86" stroke-width="4" marker-end="url(#rc-n)"/></g>
<g class="a-ap" style="--d:1.8s"><g><rect x="676" y="110" width="284" height="132" rx="16" fill="#fff" stroke="#E5194F" stroke-width="3"/>
<text x="818.0" y="142" font-size="20" font-weight="800" fill="#E5194F" text-anchor="middle">4. Transporte</text>
<text x="818.0" y="168" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">Los nutrientes pasan a la</text>
<text x="818.0" y="188.8" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">sangre y el sistema</text>
<text x="818.0" y="209.6" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">circulatorio los lleva.</text></g></g>
<g class="a-ap" style="--d:2.1s"><path d="M818 242 L818 264" stroke="#5B2A86" stroke-width="4" marker-end="url(#rc-n)"/></g>
<g class="a-ap" style="--d:2.4s"><g><rect x="676" y="268" width="284" height="132" rx="16" fill="#fff" stroke="#5B2A86" stroke-width="3"/>
<text x="818.0" y="300" font-size="20" font-weight="800" fill="#5B2A86" text-anchor="middle">5. Uso en las células</text>
<text x="818.0" y="326" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">Con el oxígeno del sistema</text>
<text x="818.0" y="346.8" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">respiratorio, las células</text>
<text x="818.0" y="367.6" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">obtienen energía.</text></g></g>
<g class="a-ap" style="--d:2.8s"><path d="M672 333 L652 333" stroke="#5B2A86" stroke-width="4" marker-end="url(#rc-n)"/></g>
<g class="a-ap" style="--d:3.0s"><g><rect x="364" y="268" width="284" height="132" rx="16" fill="#fff" stroke="#1F9D6B" stroke-width="3"/>
<text x="506.0" y="300" font-size="20" font-weight="800" fill="#1F9D6B" text-anchor="middle">6. Eliminación</text>
<text x="506.0" y="326" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">El sistema excretor saca los</text>
<text x="506.0" y="346.8" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">desechos.</text></g></g>
<g class="a-vida"><circle r="9" fill="#F0731E" opacity="0" stroke="#fff" stroke-width="2"><animateMotion path="M169 242 L169 264" dur="6.5s" begin="4s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0;0.2;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0;0.03;0.17;0.2;1" dur="6.5s" begin="4s" repeatCount="indefinite"/></circle><circle r="9" fill="#F0731E" opacity="0" stroke="#fff" stroke-width="2"><animateMotion path="M290 333 Q330 333 330 250 Q330 175 356 175" dur="6.5s" begin="4s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.2;0.4;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.2;0.23;0.37;0.4;1" dur="6.5s" begin="4s" repeatCount="indefinite"/></circle><circle r="9" fill="#F0731E" opacity="0" stroke="#fff" stroke-width="2"><animateMotion path="M650 175 L672 175" dur="6.5s" begin="4s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.4;0.6;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.4;0.43;0.57;0.6;1" dur="6.5s" begin="4s" repeatCount="indefinite"/></circle><circle r="9" fill="#F0731E" opacity="0" stroke="#fff" stroke-width="2"><animateMotion path="M818 242 L818 264" dur="6.5s" begin="4s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.6;0.8;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.6;0.63;0.77;0.8;1" dur="6.5s" begin="4s" repeatCount="indefinite"/></circle><circle r="9" fill="#F0731E" opacity="0" stroke="#fff" stroke-width="2"><animateMotion path="M672 333 L652 333" dur="6.5s" begin="4s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.8;1;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.8;0.83;0.97;1;1" dur="6.5s" begin="4s" repeatCount="indefinite"/></circle></g>
<text x="500" y="450" font-size="17" font-weight="700" fill="#5B2A86" text-anchor="middle">La línea entre las dos zonas es el momento en que el alimento entra al cuerpo.</text>
</svg>
