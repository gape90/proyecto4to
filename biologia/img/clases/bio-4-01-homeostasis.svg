<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="Esquema circular de cuatro pasos: 1, cambia algo; 2, el cuerpo lo detecta; 3, el cuerpo responde; 4, vuelve al equilibrio. La flecha del último paso lleva de nuevo al primero. El ejemplo es la temperatura del cuerpo al correr." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<defs><marker id="ci-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#5B2A86"/></marker></defs>
<rect x="0" y="0" width="1000" height="600" rx="28" fill="#F7F4FD"/>
<text x="500" y="296" font-size="24" font-weight="800" fill="#5B2A86" text-anchor="middle">Equilibrio del</text>
<text x="500" y="326" font-size="24" font-weight="800" fill="#5B2A86" text-anchor="middle">medio interno</text>
<g class="a-ap" style="--d:0.0s"><rect x="350" y="40" width="300" height="130" rx="22" fill="#fff" stroke="#4B4FA3" stroke-width="4"/>
<circle cx="356" cy="46" r="22" fill="#4B4FA3"/>
<text x="356" y="54" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="500.0" y="84" font-size="22" font-weight="800" fill="#4B4FA3" text-anchor="middle">Cambia algo</text>
<text x="500.0" y="114" font-size="17" font-weight="600" fill="#4A4870" text-anchor="middle">Por ejemplo, corrés y la</text>
<text x="500.0" y="136.1" font-size="17" font-weight="600" fill="#4A4870" text-anchor="middle">temperatura del cuerpo sube.</text></g>
<g class="a-ap" style="--d:0.6s"><path d="M650 120 Q760 130 790 228" fill="none" stroke="#5B2A86" stroke-width="4" marker-end="url(#ci-p)"/></g>
<g class="a-ap" style="--d:1.1s"><rect x="640" y="232" width="320" height="130" rx="22" fill="#fff" stroke="#B83A7A" stroke-width="4"/>
<circle cx="646" cy="238" r="22" fill="#B83A7A"/>
<text x="646" y="246" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="800.0" y="276" font-size="22" font-weight="800" fill="#B83A7A" text-anchor="middle">El cuerpo lo detecta</text>
<text x="800.0" y="306" font-size="17" font-weight="600" fill="#4A4870" text-anchor="middle">Registra que el valor se alejó</text>
<text x="800.0" y="328.1" font-size="17" font-weight="600" fill="#4A4870" text-anchor="middle">de lo normal.</text></g>
<g class="a-ap" style="--d:1.7s"><path d="M790 372 Q770 450 650 470" fill="none" stroke="#5B2A86" stroke-width="4" marker-end="url(#ci-p)"/></g>
<g class="a-ap" style="--d:2.2s"><rect x="350" y="440" width="300" height="130" rx="22" fill="#fff" stroke="#E5194F" stroke-width="4"/>
<circle cx="356" cy="446" r="22" fill="#E5194F"/>
<text x="356" y="454" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="500.0" y="484" font-size="22" font-weight="800" fill="#E5194F" text-anchor="middle">El cuerpo responde</text>
<text x="500.0" y="514" font-size="17" font-weight="600" fill="#4A4870" text-anchor="middle">Por ejemplo, transpira y el</text>
<text x="500.0" y="536.1" font-size="17" font-weight="600" fill="#4A4870" text-anchor="middle">sudor enfría la piel.</text></g>
<g class="a-ap" style="--d:2.8s"><path d="M350 520 Q240 500 210 380" fill="none" stroke="#5B2A86" stroke-width="4" marker-end="url(#ci-p)"/></g>
<g class="a-ap" style="--d:3.3s"><rect x="40" y="232" width="320" height="130" rx="22" fill="#fff" stroke="#1F9D6B" stroke-width="4"/>
<circle cx="46" cy="238" r="22" fill="#1F9D6B"/>
<text x="46" y="246" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="200.0" y="276" font-size="22" font-weight="800" fill="#1F9D6B" text-anchor="middle">Vuelve al equilibrio</text>
<text x="200.0" y="306" font-size="17" font-weight="600" fill="#4A4870" text-anchor="middle">La temperatura baja a su valor</text>
<text x="200.0" y="328.1" font-size="17" font-weight="600" fill="#4A4870" text-anchor="middle">normal y la respuesta se</text>
<text x="200.0" y="350.2" font-size="17" font-weight="600" fill="#4A4870" text-anchor="middle">frena.</text></g>
<g class="a-ap" style="--d:3.9s"><path d="M210 222 Q230 150 350 120" fill="none" stroke="#5B2A86" stroke-width="4" marker-end="url(#ci-p)"/></g>
</svg>
