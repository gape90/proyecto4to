<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="Ilustración del cuerpo humano de frente con el sistema urinario. A la altura de la cintura, a los dos lados de la columna, están los dos riñones; a cada riñón le llega sangre por una arteria y la sangre limpia sale por una vena. De cada riñón baja un uréter hasta la vejiga, en la parte baja del abdomen, y de la vejiga sale la uretra." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
