<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 950" role="img" aria-label="Esquema del recorrido de un alimento. Primero, la alimentación, fuera del cuerpo y voluntaria: elegir y preparar, y comer. Después, la nutrición, que empieza en la boca y es casi toda involuntaria: digestión en el sistema digestivo; transporte de los nutrientes por la sangre, con el sistema circulatorio; uso en las células, con el oxígeno del sistema respiratorio; y eliminación de los desechos por el sistema excretor." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<defs><marker id="rc-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#F0731E"/></marker><marker id="rc-n" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#5B2A86"/></marker></defs>
<rect x="0" y="0" width="520" height="950" rx="28" fill="#F7F4FD"/>
<rect x="16" y="14" width="488" height="300" rx="22" fill="#FFF4EA" stroke="#F0731E" stroke-width="3"/>
<text x="260" y="48" font-size="24" font-weight="800" fill="#F0731E" text-anchor="middle">Alimentación</text>
<text x="260" y="72" font-size="15" font-weight="700" fill="#4A4870" text-anchor="middle">Fuera del cuerpo · voluntaria</text>
<rect x="16" y="330" width="488" height="600" rx="22" fill="#F1EEFB" stroke="#5B2A86" stroke-width="3"/>
<text x="40" y="364" font-size="24" font-weight="800" fill="#5B2A86" text-anchor="start">Nutrición</text>
<text x="40" y="388" font-size="15" font-weight="700" fill="#4A4870" text-anchor="start">Desde la boca · casi toda involuntaria</text>
<g class="a-ap" style="--d:0.0s"><rect x="36" y="90" width="448" height="96" rx="16" fill="#fff" stroke="#F0731E" stroke-width="3"/>
<text x="260.0" y="122" font-size="19" font-weight="800" fill="#F0731E" text-anchor="middle">1. Elegir y preparar</text>
<text x="260.0" y="148" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">Qué comer, cómo cocinarlo, con quién.</text></g>
<g class="a-ap" style="--d:0.3s"><path d="M260 188 L260 196" stroke="#F0731E" stroke-width="4" marker-end="url(#rc-a)"/></g>
<g class="a-ap" style="--d:0.5s"><rect x="36" y="200" width="448" height="96" rx="16" fill="#fff" stroke="#F0731E" stroke-width="3"/>
<text x="260.0" y="232" font-size="19" font-weight="800" fill="#F0731E" text-anchor="middle">2. Comer</text>
<text x="260.0" y="258" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">Llevar el alimento a la boca.</text></g>
<g class="a-ap" style="--d:0.8s"><path d="M440 298 L440 400" stroke="#5B2A86" stroke-width="4" marker-end="url(#rc-n)"/></g>
<g class="a-ap" style="--d:1.0s"><rect x="36" y="404" width="448" height="116" rx="16" fill="#fff" stroke="#4B4FA3" stroke-width="3"/>
<text x="260.0" y="436" font-size="19" font-weight="800" fill="#4B4FA3" text-anchor="middle">3. Digestión</text>
<text x="260.0" y="462" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">El sistema digestivo parte los nutrientes en</text>
<text x="260.0" y="481.5" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">unidades más chicas.</text></g>
<g class="a-ap" style="--d:1.3s"><path d="M260 522 L260 530" stroke="#5B2A86" stroke-width="4" marker-end="url(#rc-n)"/></g>
<g class="a-ap" style="--d:1.5s"><rect x="36" y="534" width="448" height="116" rx="16" fill="#fff" stroke="#E5194F" stroke-width="3"/>
<text x="260.0" y="566" font-size="19" font-weight="800" fill="#E5194F" text-anchor="middle">4. Transporte</text>
<text x="260.0" y="592" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">Los nutrientes pasan a la sangre y el sistema</text>
<text x="260.0" y="611.5" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">circulatorio los lleva.</text></g>
<g class="a-ap" style="--d:1.8s"><path d="M260 652 L260 660" stroke="#5B2A86" stroke-width="4" marker-end="url(#rc-n)"/></g>
<g class="a-ap" style="--d:2.0s"><rect x="36" y="664" width="448" height="116" rx="16" fill="#fff" stroke="#5B2A86" stroke-width="3"/>
<text x="260.0" y="696" font-size="19" font-weight="800" fill="#5B2A86" text-anchor="middle">5. Uso en las células</text>
<text x="260.0" y="722" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">Con el oxígeno del sistema respiratorio, las</text>
<text x="260.0" y="741.5" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">células obtienen energía.</text></g>
<g class="a-ap" style="--d:2.3s"><path d="M260 782 L260 790" stroke="#5B2A86" stroke-width="4" marker-end="url(#rc-n)"/></g>
<g class="a-ap" style="--d:2.5s"><rect x="36" y="794" width="448" height="116" rx="16" fill="#fff" stroke="#1F9D6B" stroke-width="3"/>
<text x="260.0" y="826" font-size="19" font-weight="800" fill="#1F9D6B" text-anchor="middle">6. Eliminación</text>
<text x="260.0" y="852" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">El sistema excretor saca los desechos.</text></g>
<g class="a-vida"><circle r="9" fill="#F0731E" opacity="0" stroke="#fff" stroke-width="2"><animateMotion path="M260 188 L260 196" dur="6.5s" begin="3.5s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0;0.2;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0;0.03;0.17;0.2;1" dur="6.5s" begin="3.5s" repeatCount="indefinite"/></circle><circle r="9" fill="#F0731E" opacity="0" stroke="#fff" stroke-width="2"><animateMotion path="M440 298 L440 400" dur="6.5s" begin="3.5s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.2;0.4;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.2;0.23;0.37;0.4;1" dur="6.5s" begin="3.5s" repeatCount="indefinite"/></circle><circle r="9" fill="#F0731E" opacity="0" stroke="#fff" stroke-width="2"><animateMotion path="M260 522 L260 530" dur="6.5s" begin="3.5s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.4;0.6;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.4;0.43;0.57;0.6;1" dur="6.5s" begin="3.5s" repeatCount="indefinite"/></circle><circle r="9" fill="#F0731E" opacity="0" stroke="#fff" stroke-width="2"><animateMotion path="M260 652 L260 660" dur="6.5s" begin="3.5s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.6;0.8;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.6;0.63;0.77;0.8;1" dur="6.5s" begin="3.5s" repeatCount="indefinite"/></circle><circle r="9" fill="#F0731E" opacity="0" stroke="#fff" stroke-width="2"><animateMotion path="M260 782 L260 790" dur="6.5s" begin="3.5s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.8;1;1" calcMode="linear"/><animate attributeName="opacity" values="0;0;0.95;0.95;0;0" keyTimes="0;0.8;0.83;0.97;1;1" dur="6.5s" begin="3.5s" repeatCount="indefinite"/></circle></g>
</svg>
