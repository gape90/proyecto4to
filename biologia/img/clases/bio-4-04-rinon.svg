<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="Dibujo en dos columnas. A la izquierda, la sangre que llega al riñón: lleva agua, sales, glucosa y urea. A la derecha, lo que sale del riñón por dos caminos: por la vena, la sangre limpia, con agua, sales y glucosa, y sin urea; por el uréter, la orina, con urea, agua y las sales que sobran." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<defs><marker id="rn-r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#C62828"/></marker><marker id="rn-a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#1E5AA8"/></marker><marker id="rn-u" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#B08A00"/></marker></defs>
<rect x="0" y="0" width="1000" height="420" rx="28" fill="#F7F4FD"/>
<g class="a-ap" style="--d:0.0s"><text x="170" y="40" font-size="24" font-weight="800" fill="#5B2A86" text-anchor="middle">Antes</text><text x="170" y="66" font-size="17" font-weight="700" fill="#4A4870" text-anchor="middle">La sangre que llega al riñón</text></g>
<g class="a-ap" style="--d:0.2s"><rect x="40" y="92" width="260" height="200" rx="18" fill="#FDECEC" stroke="#C62828" stroke-width="2.5"/><circle cx="74" cy="132" r="11" fill="#4FA3E0" stroke="#fff" stroke-width="2.5"/><text x="96" y="138" font-size="18" font-weight="700" fill="#1B1A4A" text-anchor="start">Agua</text><circle cx="74" cy="172" r="11" fill="#9AA0B4" stroke="#fff" stroke-width="2.5"/><text x="96" y="178" font-size="18" font-weight="700" fill="#1B1A4A" text-anchor="start">Sales</text><circle cx="74" cy="212" r="11" fill="#F0731E" stroke="#fff" stroke-width="2.5"/><text x="96" y="218" font-size="18" font-weight="700" fill="#1B1A4A" text-anchor="start">Glucosa</text><circle cx="74" cy="252" r="11" fill="#C9A400" stroke="#fff" stroke-width="2.5"/><text x="96" y="258" font-size="18" font-weight="700" fill="#1B1A4A" text-anchor="start">Urea</text></g>
<g class="a-ap" style="--d:0.5s"><path d="M300 192 L410 192" stroke="#C62828" stroke-width="6" fill="none" marker-end="url(#rn-r)"/><text x="355" y="180" font-size="16" font-weight="700" fill="#C62828" text-anchor="middle">arteria</text></g>
<g class="a-ap" style="--d:0.7s"><path transform="translate(500 192) scale(1.0)" d="M-40 -95 C-95 -95 -105 -20 -85 25 C-70 60 -75 95 -30 105 C15 115 45 70 40 35 C35 10 10 5 12 -15 C14 -40 40 -45 35 -70 C30 -95 0 -100 -40 -95Z" fill="#C66B5A" stroke="#8E3B2E" stroke-width="3"/><path transform="translate(500 192) scale(1.0)" d="M-55 -60 C-80 -30 -80 30 -55 70" fill="none" stroke="#F2B3A6" stroke-width="5" stroke-linecap="round" opacity=".7"/><text x="500" y="330" font-size="20" font-weight="800" fill="#8E3B2E" text-anchor="middle">Riñón</text><text x="500" y="354" font-size="16" font-weight="700" fill="#4A4870" text-anchor="middle">filtrado y reabsorción</text></g>
<g class="a-ap" style="--d:1.0s"><path d="M560 150 Q610 110 660 110" stroke="#1E5AA8" stroke-width="6" fill="none" marker-end="url(#rn-a)"/><text x="612" y="96" font-size="16" font-weight="700" fill="#1E5AA8" text-anchor="middle">vena</text></g>
<g class="a-ap" style="--d:1.0s"><path d="M545 250 Q600 300 660 310" stroke="#B08A00" stroke-width="6" fill="none" marker-end="url(#rn-u)"/><text x="604" y="330" font-size="16" font-weight="700" fill="#8A6C00" text-anchor="middle">uréter</text></g>
<g class="a-ap" style="--d:1.3s"><text x="830" y="40" font-size="24" font-weight="800" fill="#5B2A86" text-anchor="middle">Después</text></g>
<g class="a-ap" style="--d:1.4s"><rect x="680" y="60" width="290" height="160" rx="18" fill="#EAF1FB" stroke="#1E5AA8" stroke-width="2.5"/><text x="825" y="90" font-size="19" font-weight="800" fill="#1E5AA8" text-anchor="middle">Sangre limpia</text><circle cx="712" cy="122" r="11" fill="#4FA3E0" stroke="#fff" stroke-width="2.5"/><text x="734" y="128" font-size="18" font-weight="700" fill="#1B1A4A" text-anchor="start">Agua</text><circle cx="712" cy="162" r="11" fill="#9AA0B4" stroke="#fff" stroke-width="2.5"/><text x="734" y="168" font-size="18" font-weight="700" fill="#1B1A4A" text-anchor="start">Sales</text><circle cx="712" cy="202" r="11" fill="#F0731E" stroke="#fff" stroke-width="2.5"/><text x="734" y="208" font-size="18" font-weight="700" fill="#1B1A4A" text-anchor="start">Glucosa</text></g>
<g class="a-ap" style="--d:1.7s"><rect x="680" y="240" width="290" height="160" rx="18" fill="#FFF7D6" stroke="#B08A00" stroke-width="2.5"/><text x="825" y="270" font-size="19" font-weight="800" fill="#8A6C00" text-anchor="middle">Orina</text><circle cx="712" cy="302" r="11" fill="#C9A400" stroke="#fff" stroke-width="2.5"/><text x="734" y="308" font-size="18" font-weight="700" fill="#1B1A4A" text-anchor="start">Urea</text><circle cx="712" cy="342" r="11" fill="#4FA3E0" stroke="#fff" stroke-width="2.5"/><text x="734" y="348" font-size="18" font-weight="700" fill="#1B1A4A" text-anchor="start">Agua que sobra</text><circle cx="712" cy="382" r="11" fill="#9AA0B4" stroke="#fff" stroke-width="2.5"/><text x="734" y="388" font-size="18" font-weight="700" fill="#1B1A4A" text-anchor="start">Sales que sobran</text></g>
</svg>
