<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 750" role="img" aria-label="Esquema circular de cuatro pasos: 1, cambia algo; 2, el cuerpo lo detecta; 3, el cuerpo responde; 4, vuelve al equilibrio. La flecha del último paso lleva de nuevo al primero. El ejemplo es la temperatura del cuerpo al correr." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<defs><marker id="ci-p" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#5B2A86"/></marker></defs>
<rect x="0" y="0" width="520" height="750" rx="28" fill="#F7F4FD"/>
<g class="a-ap" style="--d:0.0s"><rect x="30" y="16" width="460" height="130" rx="22" fill="#fff" stroke="#4B4FA3" stroke-width="4"/>
<circle cx="36" cy="22" r="22" fill="#4B4FA3"/>
<text x="36" y="30" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="260.0" y="60" font-size="22" font-weight="800" fill="#4B4FA3" text-anchor="middle">Cambia algo</text>
<text x="260.0" y="90" font-size="17" font-weight="600" fill="#4A4870" text-anchor="middle">Por ejemplo, corrés y la temperatura del</text>
<text x="260.0" y="112.1" font-size="17" font-weight="600" fill="#4A4870" text-anchor="middle">cuerpo sube.</text></g>
<g class="a-ap" style="--d:0.4s"><path d="M260 148 L260 194" stroke="#5B2A86" stroke-width="4" fill="none" marker-end="url(#ci-p)"/></g>
<g class="a-ap" style="--d:0.8s"><rect x="30" y="196" width="460" height="130" rx="22" fill="#fff" stroke="#B83A7A" stroke-width="4"/>
<circle cx="36" cy="202" r="22" fill="#B83A7A"/>
<text x="36" y="210" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="260.0" y="240" font-size="22" font-weight="800" fill="#B83A7A" text-anchor="middle">El cuerpo lo detecta</text>
<text x="260.0" y="270" font-size="17" font-weight="600" fill="#4A4870" text-anchor="middle">Registra que el valor se alejó de lo</text>
<text x="260.0" y="292.1" font-size="17" font-weight="600" fill="#4A4870" text-anchor="middle">normal.</text></g>
<g class="a-ap" style="--d:1.2s"><path d="M260 328 L260 374" stroke="#5B2A86" stroke-width="4" fill="none" marker-end="url(#ci-p)"/></g>
<g class="a-ap" style="--d:1.6s"><rect x="30" y="376" width="460" height="130" rx="22" fill="#fff" stroke="#E5194F" stroke-width="4"/>
<circle cx="36" cy="382" r="22" fill="#E5194F"/>
<text x="36" y="390" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="260.0" y="420" font-size="22" font-weight="800" fill="#E5194F" text-anchor="middle">El cuerpo responde</text>
<text x="260.0" y="450" font-size="17" font-weight="600" fill="#4A4870" text-anchor="middle">Por ejemplo, transpira y el sudor enfría</text>
<text x="260.0" y="472.1" font-size="17" font-weight="600" fill="#4A4870" text-anchor="middle">la piel.</text></g>
<g class="a-ap" style="--d:2.0s"><path d="M260 508 L260 554" stroke="#5B2A86" stroke-width="4" fill="none" marker-end="url(#ci-p)"/></g>
<g class="a-ap" style="--d:2.4s"><rect x="30" y="556" width="460" height="130" rx="22" fill="#fff" stroke="#1F9D6B" stroke-width="4"/>
<circle cx="36" cy="562" r="22" fill="#1F9D6B"/>
<text x="36" y="570" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="260.0" y="600" font-size="22" font-weight="800" fill="#1F9D6B" text-anchor="middle">Vuelve al equilibrio</text>
<text x="260.0" y="630" font-size="17" font-weight="600" fill="#4A4870" text-anchor="middle">La temperatura baja a su valor normal y</text>
<text x="260.0" y="652.1" font-size="17" font-weight="600" fill="#4A4870" text-anchor="middle">la respuesta se frena.</text></g>
<g class="a-ap" style="--d:3.4s"><path d="M492 620 Q512 620 512 580 L512 100 Q512 80 494 80" stroke="#5B2A86" stroke-width="4" fill="none" marker-end="url(#ci-p)"/></g>
<g class="a-ap" style="--d:3.6s"><text x="260" y="724" font-size="16" font-weight="700" fill="#5B2A86" text-anchor="middle">Si algo vuelve a cambiar, el ciclo empieza otra vez.</text></g>
</svg>
