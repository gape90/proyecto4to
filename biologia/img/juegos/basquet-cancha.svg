<path d="M580 65h13v70h-8V76h-5z" fill="#302d4b"/><path d="M585 72h28v9h-28z" fill="#302d4b"/>
<rect x="548" y="23" width="34" height="69" rx="3" fill="url(#board)" stroke="#c8c4dc" stroke-width="2"/>
<path d="M553 28h24v54h-24z" fill="url(#glass)"/><rect x="554" y="52" width="21" height="19" fill="none" stroke="#db5147" stroke-width="2"/>
