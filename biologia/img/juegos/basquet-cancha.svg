<g fill="#f0b56f" opacity=".72"><circle cx="24" cy="52" r="1.6"/><circle cx="48" cy="57" r="1.4"/><circle cx="76" cy="60" r="1.7"/><circle cx="102" cy="63" r="1.4"/><circle cx="133" cy="67" r="1.6"/><circle cx="165" cy="69" r="1.4"/><circle cx="198" cy="72" r="1.6"/><circle cx="232" cy="74" r="1.5"/><circle cx="267" cy="75" r="1.7"/><circle cx="303" cy="76" r="1.4"/><circle cx="341" cy="76" r="1.6"/><circle cx="378" cy="75" r="1.5"/><circle cx="414" cy="73" r="1.6"/><circle cx="451" cy="70" r="1.4"/><circle cx="487" cy="67" r="1.6"/><circle cx="525" cy="63" r="1.5"/><circle cx="561" cy="59" r="1.7"/><circle cx="598" cy="54" r="1.5"/><circle cx="625" cy="50" r="1.5"/></g>
<g fill="#c4bddb" opacity=".65"><circle cx="36" cy="77" r="1.3"/><circle cx="69" cy="82" r="1.5"/><circle cx="110" cy="86" r="1.2"/><circle cx="151" cy="91" r="1.4"/><circle cx="194" cy="95" r="1.3"/><circle cx="240" cy="98" r="1.4"/><circle cx="287" cy="100" r="1.3"/><circle cx="335" cy="100" r="1.4"/><circle cx="382" cy="98" r="1.3"/><circle cx="430" cy="95" r="1.4"/><circle cx="475" cy="91" r="1.3"/><circle cx="520" cy="86" r="1.5"/><circle cx="565" cy="81" r="1.3"/><circle cx="610" cy="75" r="1.5"/></g>
<!-- Stadium fascia -->
<path d="M0 114Q320 147 640 109v12Q320 157 0 127z" fill="#1e2039"/><path d="M0 126Q320 156 640 118" fill="none" stroke="#f0731e" stroke-opacity=".55" stroke-width="2"/>
