<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-label="Cancha de básquet en un estadio">
<defs>
 <linearGradient id="arena" x2="0" y2="1"><stop stop-color="#17192f"/><stop offset=".7" stop-color="#292744"/><stop offset="1" stop-color="#51456a"/></linearGradient>
 <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#dfa66e"/><stop offset="1" stop-color="#a65e48"/></linearGradient>
 <linearGradient id="board" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#dcd9ed"/></linearGradient>
 <radialGradient id="lamp"><stop stop-color="#fff9df" stop-opacity=".7"/><stop offset="1" stop-color="#fff9df" stop-opacity="0"/></radialGradient>
 <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".13"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
 <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.8"><feGaussianBlur stdDeviation="3"/></filter>
 <pattern id="boards" width="92" height="18" patternUnits="userSpaceOnUse"><path d="M0 17.5H92M45 0v18" fill="none" stroke="#75483f" stroke-opacity=".24" stroke-width=".8"/></pattern>
</defs>
<g transform="scale(1 1.3913)">
<!-- Arena and architectural light -->
<path fill="url(#arena)" d="M0 0h640v150H0z"/>
<ellipse cx="125" cy="7" rx="140" ry="115" fill="url(#lamp)"/><ellipse cx="490" cy="2" rx="130" ry="110" fill="url(#lamp)"/>
<path d="M0 32Q320 78 640 28M0 54Q320 96 640 48M0 77Q320 112 640 70" fill="none" stroke="#9690bb" stroke-opacity=".17" stroke-width="2"/>
