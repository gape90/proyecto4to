<ellipse cx="514" cy="82" rx="24" ry="5.5" fill="none" stroke="#8e362f" stroke-width="7" opacity=".45" transform="translate(0 2)"/>
<ellipse cx="514" cy="80" rx="24" ry="5.5" fill="none" stroke="#e95b43" stroke-width="5"/><path d="M491 79q23-7 46 0" fill="none" stroke="#ff9c72" stroke-width="1.4"/>
<!-- Light reflections on court -->
<path d="M78 141h190l-104 75H15zM303 136h112l-45 76h-95z" fill="#fff4da" opacity=".055"/>
</g>
</svg>

