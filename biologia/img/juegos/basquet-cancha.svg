<g fill="none" stroke="#fff" stroke-opacity=".88" stroke-width="1.4"><path d="M495 82l5 28m7-28 3 31m7-31 1 32m7-32-2 31m8-31-5 29"/><path d="M497 94h34M499 104h29"/></g>
