<path fill="url(#wood)" d="M0 139 640 126v104H0z"/><path fill="url(#boards)" d="M0 139 640 126v104H0z" opacity=".85"/>
<path d="M0 139 640 126" stroke="#ffe5c4" stroke-opacity=".7" stroke-width="2"/>
