<path d="M480 130v79h160M480 166a38 38 0 0 0 38 40" fill="none" stroke="#fff4e6" stroke-opacity=".85" stroke-width="2"/>
<path d="M0 212h640" stroke="#fff4e6" stroke-opacity=".85" stroke-width="2"/>
<path d="M0 191h640M0 174h640M0 157h640" stroke="#73473f" stroke-opacity=".18"/>
