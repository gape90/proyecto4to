<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 560" role="img" aria-label="Triángulo rectángulo con un ángulo agudo α. La hipotenusa es el lado opuesto al ángulo recto; el cateto opuesto está enfrente de α y el cateto adyacente forma α junto con la hipotenusa. Seno de α es opuesto sobre hipotenusa; coseno de α es adyacente sobre hipotenusa." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<g class="a-ap" style="--d:0.00s"><polygon points="40,330 330,330 330,110" fill="#EFEAFB" stroke="#4A4870" stroke-width="3"/><rect x="304" y="304" width="26" height="26" fill="none" stroke="#4A4870" stroke-width="2.5"/><path d="M110 330 A70 70 0 0 0 95.8 287.7" fill="none" stroke="#1F9D6B" stroke-width="3"/><text x="132.0" y="314.0" text-anchor="middle" font-size="26" font-weight="800" fill="#1F9D6B" >α</text></g>
<g class="a-ap" style="--d:0.70s"><line x1="40" y1="330" x2="330" y2="110" stroke="#B83A7A" stroke-width="7" stroke-linecap="round"/><text x="145.0" y="204.0" text-anchor="middle" font-size="22" font-weight="800" fill="#B83A7A" transform="rotate(-37.2 145.0 204.0)">hipotenusa</text></g>
<g class="a-ap" style="--d:1.40s"><line x1="330" y1="330" x2="330" y2="110" stroke="#4B4FA3" stroke-width="7" stroke-linecap="round"/><text x="346.0" y="214.0" text-anchor="start" font-size="22" font-weight="800" fill="#4B4FA3" >cateto</text><text x="346.0" y="242.0" text-anchor="start" font-size="22" font-weight="800" fill="#4B4FA3" >opuesto a α</text></g>
<g class="a-ap" style="--d:2.10s"><line x1="40" y1="330" x2="330" y2="330" stroke="#B26A00" stroke-width="7" stroke-linecap="round"/><text x="185.0" y="368.0" text-anchor="middle" font-size="22" font-weight="800" fill="#B26A00" >cateto adyacente a α</text></g>
<g class="a-ap" style="--d:2.80s"><text x="250.0" y="470.0" text-anchor="middle" font-size="22" font-weight="800" fill="#4B4FA3" >sen α = opuesto / hipotenusa</text><text x="250.0" y="515.0" text-anchor="middle" font-size="22" font-weight="800" fill="#B26A00" >cos α = adyacente / hipotenusa</text></g>
</svg>
