<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Esquema de conjuntos: dentro de los números reales están los racionales, que incluyen a los enteros, que a su vez incluyen a los naturales. Al lado, sin superponerse, están los irracionales, como √2, π y √5." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<g class="a-ap" style="--d:0.00s"><rect x="10" y="10" width="980" height="500" rx="34" fill="#EFEAFB" stroke="#5B2A86" stroke-opacity=".3" stroke-width="2"/><text x="40.0" y="54.0" text-anchor="start" font-size="28" font-weight="800" fill="#5B2A86" >Números reales</text></g>
<g class="a-ap" style="--d:0.50s"><ellipse cx="330" cy="290" rx="300" ry="190" fill="#fff" stroke="#4B4FA3" stroke-width="3"/><text x="330.0" y="126.0" text-anchor="middle" font-size="24" font-weight="800" fill="#4B4FA3" >Racionales</text><text x="82.0" y="300.0" text-anchor="middle" font-size="24" font-weight="700" fill="#1B1A4A" >1/2</text><text x="578.0" y="300.0" text-anchor="middle" font-size="24" font-weight="700" fill="#1B1A4A" >0,25</text><text x="330.0" y="165.0" text-anchor="middle" font-size="24" font-weight="700" fill="#1B1A4A" >−0,333…</text></g>
<g class="a-ap" style="--d:1.20s"><ellipse cx="330" cy="320" rx="200" ry="140" fill="#E4F6EE" stroke="#1F9D6B" stroke-width="3"/><text x="330.0" y="210.0" text-anchor="middle" font-size="24" font-weight="800" fill="#1F9D6B" >Enteros</text><text x="200.0" y="330.0" text-anchor="middle" font-size="24" font-weight="700" fill="#1B1A4A" >−3</text><text x="460.0" y="330.0" text-anchor="middle" font-size="24" font-weight="700" fill="#1B1A4A" >−10</text></g>
<g class="a-ap" style="--d:1.90s"><ellipse cx="330" cy="360" rx="100" ry="80" fill="#FFF3DC" stroke="#B26A00" stroke-width="3"/><text x="330.0" y="330.0" text-anchor="middle" font-size="24" font-weight="800" fill="#B26A00" >Naturales</text><text x="305.0" y="380.0" text-anchor="middle" font-size="24" font-weight="700" fill="#1B1A4A" >1</text><text x="355.0" y="380.0" text-anchor="middle" font-size="24" font-weight="700" fill="#1B1A4A" >7</text></g>
<g class="a-ap" style="--d:2.60s"><ellipse cx="810" cy="290" rx="150" ry="160" fill="#F6E3EE" stroke="#B83A7A" stroke-width="3"/><text x="810.0" y="186.0" text-anchor="middle" font-size="24" font-weight="800" fill="#B83A7A" >Irracionales</text><text x="770.0" y="270.0" text-anchor="middle" font-size="24" font-weight="700" fill="#1B1A4A" >√2</text><text x="850.0" y="300.0" text-anchor="middle" font-size="24" font-weight="700" fill="#1B1A4A" >π</text><text x="790.0" y="350.0" text-anchor="middle" font-size="24" font-weight="700" fill="#1B1A4A" >√5</text></g>
</svg>
