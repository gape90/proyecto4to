<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="Árbol de dos extracciones sin reposición de una bolsa con 3 bolillas rojas y 2 azules. Primera: roja 3/5, azul 2/5. Después de una roja: roja 2/4, azul 2/4. Después de una azul: roja 3/4, azul 1/4. Resultados: RR 6/20, RA 6/20, AR 6/20, AA 2/20." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<g class="a-ap" style="--d:0.00s"><circle cx="70" cy="225.0" r="10" fill="#4A4870"/><text x="70.0" y="259.0" text-anchor="middle" font-size="20" font-weight="700" fill="#4A4870" >Bolsa</text></g>
