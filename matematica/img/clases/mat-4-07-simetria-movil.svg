<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 540" role="img" aria-label="Circunferencia trigonométrica con los ángulos de 30°, 150°, 210° y 330°. Sus puntos son (0,87; 0,5), (−0,87; 0,5), (−0,87; −0,5) y (0,87; −0,5): son simétricos respecto de los ejes y solo cambian los signos." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<g class="a-ap" style="--d:0.00s"><line x1="72" y1="250" x2="428" y2="250" stroke="#4A4870" stroke-width="2.5"/><line x1="250" y1="92" x2="250" y2="408" stroke="#4A4870" stroke-width="2.5"/><circle cx="250" cy="250" r="118" fill="none" stroke="#E2DAF6" stroke-width="4"/></g>
<g class="a-ap" style="--d:0.40s"><line x1="250" y1="250" x2="352.2" y2="191.0" stroke="#4B4FA3" stroke-width="3.5"/><line x1="352.2" y1="191.0" x2="352.2" y2="250" stroke="#4B4FA3" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="352.2" cy="191.0" r="9" fill="#4B4FA3"/><text x="366.2" y="177.0" text-anchor="start" font-size="18" font-weight="800" fill="#4B4FA3" >(0,87; 0,5)</text><text x="366.2" y="151.0" text-anchor="start" font-size="18" font-weight="700" fill="#4B4FA3" >30°</text></g>
<g class="a-ap" style="--d:1.20s"><line x1="250" y1="250" x2="147.8" y2="191.0" stroke="#1F9D6B" stroke-width="3.5"/><line x1="147.8" y1="191.0" x2="147.8" y2="250" stroke="#1F9D6B" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="147.8" cy="191.0" r="9" fill="#1F9D6B"/><text x="133.8" y="177.0" text-anchor="end" font-size="18" font-weight="800" fill="#1F9D6B" >(−0,87; 0,5)</text><text x="133.8" y="151.0" text-anchor="end" font-size="18" font-weight="700" fill="#1F9D6B" >150°</text></g>
<g class="a-ap" style="--d:2.00s"><line x1="250" y1="250" x2="147.8" y2="309.0" stroke="#B26A00" stroke-width="3.5"/><line x1="147.8" y1="309.0" x2="147.8" y2="250" stroke="#B26A00" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="147.8" cy="309.0" r="9" fill="#B26A00"/><text x="133.8" y="331.0" text-anchor="end" font-size="18" font-weight="800" fill="#B26A00" >(−0,87; −0,5)</text><text x="133.8" y="357.0" text-anchor="end" font-size="18" font-weight="700" fill="#B26A00" >210°</text></g>
<g class="a-ap" style="--d:2.80s"><line x1="250" y1="250" x2="352.2" y2="309.0" stroke="#B83A7A" stroke-width="3.5"/><line x1="352.2" y1="309.0" x2="352.2" y2="250" stroke="#B83A7A" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="352.2" cy="309.0" r="9" fill="#B83A7A"/><text x="366.2" y="331.0" text-anchor="start" font-size="18" font-weight="800" fill="#B83A7A" >(0,87; −0,5)</text><text x="366.2" y="357.0" text-anchor="start" font-size="18" font-weight="700" fill="#B83A7A" >330°</text></g>
<g class="a-ap" style="--d:3.60s"><text x="250.0" y="496.0" text-anchor="middle" font-size="18" font-weight="700" fill="#4A4870" >Los cuatro puntos son simétricos:</text><text x="250.0" y="522.0" text-anchor="middle" font-size="18" font-weight="700" fill="#4A4870" >cambian los signos, no los valores.</text></g>
