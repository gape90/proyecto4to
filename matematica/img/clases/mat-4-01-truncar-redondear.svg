<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-label="Ilustración: π escrito cifra por cifra, 3,14159265… Una línea corta el número después del tercer decimal y se marca la cifra siguiente, un 5. Truncar da 3,141 y redondear da 3,142." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<defs><marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4B4FA3"/></marker><marker id="fv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F9D6B"/></marker></defs>
<g class="a-ap" style="--d:0.00s"><text x="500" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#4A4870">π a 3 decimales</text></g>
<g class="a-ap" style="--d:0.20s"><rect x="243.7" y="70" width="209.0" height="70" rx="14" fill="#E6E7F6"/></g>
<g class="a-ap" style="--d:0.20s"><text x="273.7" y="120" text-anchor="middle" font-size="58" font-weight="800" fill="#1B1A4A">3</text><text x="302.2" y="120" text-anchor="middle" font-size="58" font-weight="800" fill="#1B1A4A">,</text><text x="330.7" y="120" text-anchor="middle" font-size="58" font-weight="800" fill="#1B1A4A">1</text><text x="376.7" y="120" text-anchor="middle" font-size="58" font-weight="800" fill="#1B1A4A">4</text><text x="422.7" y="120" text-anchor="middle" font-size="58" font-weight="800" fill="#1B1A4A">1</text><text x="489.4" y="120" text-anchor="middle" font-size="58" font-weight="800" fill="#B26A00">5</text><text x="542.3" y="120" text-anchor="middle" font-size="58" font-weight="800" fill="#9A97B8">9</text><text x="588.3" y="120" text-anchor="middle" font-size="58" font-weight="800" fill="#9A97B8">2</text><text x="634.3" y="120" text-anchor="middle" font-size="58" font-weight="800" fill="#9A97B8">6</text><text x="680.3" y="120" text-anchor="middle" font-size="58" font-weight="800" fill="#9A97B8">5</text><text x="726.3" y="120" text-anchor="middle" font-size="58" font-weight="800" fill="#9A97B8">…</text></g>
<line x1="456.1" y1="56" x2="456.1" y2="154" stroke="#B83A7A" stroke-width="4" class="a-trazo" style="--d:0.90s;--l:100"/>
<g class="a-ap" style="--d:1.40s"><circle cx="489.4" cy="100" r="30" fill="none" stroke="#B26A00" stroke-width="3"/><text x="489.4" y="174" text-anchor="middle" font-size="18" font-weight="700" fill="#B26A00">cifra siguiente</text></g>
<path d="M348.2 152 L250 236" stroke="#4B4FA3" stroke-width="4" fill="none" marker-end="url(#fa)" class="a-trazo" style="--d:1.90s;--l:160"/>
<g class="a-ap" style="--d:2.30s"><rect x="40" y="250" width="420" height="230" rx="24" fill="#E6E7F6" stroke="#4B4FA3" stroke-opacity=".35" stroke-width="2"/><text x="250.0" y="296" text-anchor="middle" font-size="26" font-weight="800" fill="#4B4FA3">TRUNCAR</text><text x="250.0" y="334" text-anchor="middle" font-size="21" fill="#4A4870">Cortás y descartás las cifras</text><text x="250.0" y="362" text-anchor="middle" font-size="21" fill="#4A4870">que siguen, sin mirarlas.</text><text x="250.0" y="450" text-anchor="middle" font-size="44" font-weight="800" fill="#4B4FA3">3,141</text></g>
<path d="M489.4 186 L750 236" stroke="#1F9D6B" stroke-width="4" fill="none" marker-end="url(#fv)" class="a-trazo" style="--d:2.90s;--l:320"/>
<g class="a-ap" style="--d:3.30s"><rect x="540" y="250" width="420" height="230" rx="24" fill="#E4F6EE" stroke="#1F9D6B" stroke-opacity=".35" stroke-width="2"/><text x="750.0" y="296" text-anchor="middle" font-size="26" font-weight="800" fill="#1F9D6B">REDONDEAR</text><text x="750.0" y="334" text-anchor="middle" font-size="21" fill="#4A4870">Mirás la cifra siguiente: es 5,</text><text x="750.0" y="362" text-anchor="middle" font-size="21" fill="#4A4870">así que la última cifra sube.</text><text x="750.0" y="450" text-anchor="middle" font-size="44" font-weight="800" fill="#1F9D6B">3,142</text></g>
</svg>
