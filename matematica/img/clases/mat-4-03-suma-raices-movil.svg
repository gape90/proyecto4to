<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 800" role="img" aria-label="Un cuadrado de área 9 (lado 3) y uno de área 16 (lado 4) puestos uno al lado del otro miden 7 de largo. Un cuadrado de área 9 + 16 = 25 tiene lado 5. Por eso √9 + √16 = 7, pero √(9 + 16) = 5." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<g class="a-ap" style="--d:0.20s"><rect x="145.0" y="210" width="90" height="90" fill="#E6E7F6" stroke="#4B4FA3" stroke-width="3"/><line x1="175.0" y1="210" x2="175.0" y2="300" stroke="#4B4FA3" stroke-opacity=".35" stroke-width="1.5"/><line x1="145.0" y1="240" x2="235.0" y2="240" stroke="#4B4FA3" stroke-opacity=".35" stroke-width="1.5"/><line x1="205.0" y1="210" x2="205.0" y2="300" stroke="#4B4FA3" stroke-opacity=".35" stroke-width="1.5"/><line x1="145.0" y1="270" x2="235.0" y2="270" stroke="#4B4FA3" stroke-opacity=".35" stroke-width="1.5"/></g>
<g class="a-ap" style="--d:0.40s"><text x="190.0" y="264.0" text-anchor="middle" font-size="26" font-weight="800" fill="#4B4FA3" >9</text></g>
<g class="a-ap" style="--d:0.80s"><rect x="235.0" y="180" width="120" height="120" fill="#E4F6EE" stroke="#1F9D6B" stroke-width="3"/><line x1="265.0" y1="180" x2="265.0" y2="300" stroke="#1F9D6B" stroke-opacity=".35" stroke-width="1.5"/><line x1="235.0" y1="210" x2="355.0" y2="210" stroke="#1F9D6B" stroke-opacity=".35" stroke-width="1.5"/><line x1="295.0" y1="180" x2="295.0" y2="300" stroke="#1F9D6B" stroke-opacity=".35" stroke-width="1.5"/><line x1="235.0" y1="240" x2="355.0" y2="240" stroke="#1F9D6B" stroke-opacity=".35" stroke-width="1.5"/><line x1="325.0" y1="180" x2="325.0" y2="300" stroke="#1F9D6B" stroke-opacity=".35" stroke-width="1.5"/><line x1="235.0" y1="270" x2="355.0" y2="270" stroke="#1F9D6B" stroke-opacity=".35" stroke-width="1.5"/></g>
<g class="a-ap" style="--d:1.00s"><text x="295.0" y="249.0" text-anchor="middle" font-size="26" font-weight="800" fill="#1F9D6B" >16</text></g>
<g class="a-ap" style="--d:1.50s"><line x1="145.0" y1="322" x2="355.0" y2="322" stroke="#B83A7A" stroke-width="4"/><line x1="145.0" y1="312" x2="145.0" y2="332" stroke="#B83A7A" stroke-width="4"/><line x1="355.0" y1="312" x2="355.0" y2="332" stroke="#B83A7A" stroke-width="4"/><text x="250.0" y="360.0" text-anchor="middle" font-size="22" font-weight="800" fill="#B83A7A" >lado 3 + lado 4 = 7</text></g>
<g class="a-ap" style="--d:1.90s"><text x="250.0" y="50.0" text-anchor="middle" font-size="28" font-weight="800" fill="#1B1A4A" >√9 + √16 = 3 + 4 = 7</text></g>
<g class="a-ap" style="--d:2.50s"><rect x="175.0" y="510" width="150" height="150" fill="#FFF3DC" stroke="#B26A00" stroke-width="3"/><line x1="205.0" y1="510" x2="205.0" y2="660" stroke="#B26A00" stroke-opacity=".35" stroke-width="1.5"/><line x1="175.0" y1="540" x2="325.0" y2="540" stroke="#B26A00" stroke-opacity=".35" stroke-width="1.5"/><line x1="235.0" y1="510" x2="235.0" y2="660" stroke="#B26A00" stroke-opacity=".35" stroke-width="1.5"/><line x1="175.0" y1="570" x2="325.0" y2="570" stroke="#B26A00" stroke-opacity=".35" stroke-width="1.5"/><line x1="265.0" y1="510" x2="265.0" y2="660" stroke="#B26A00" stroke-opacity=".35" stroke-width="1.5"/><line x1="175.0" y1="600" x2="325.0" y2="600" stroke="#B26A00" stroke-opacity=".35" stroke-width="1.5"/><line x1="295.0" y1="510" x2="295.0" y2="660" stroke="#B26A00" stroke-opacity=".35" stroke-width="1.5"/><line x1="175.0" y1="630" x2="325.0" y2="630" stroke="#B26A00" stroke-opacity=".35" stroke-width="1.5"/></g>
<g class="a-ap" style="--d:2.70s"><text x="250.0" y="594.0" text-anchor="middle" font-size="26" font-weight="800" fill="#B26A00" >25</text></g>
<g class="a-ap" style="--d:3.10s"><line x1="175.0" y1="682" x2="325.0" y2="682" stroke="#B83A7A" stroke-width="4"/><text x="250.0" y="720.0" text-anchor="middle" font-size="22" font-weight="800" fill="#B83A7A" >lado 5</text></g>
<g class="a-ap" style="--d:3.50s"><text x="250.0" y="480.0" text-anchor="middle" font-size="28" font-weight="800" fill="#1B1A4A" >√(9 + 16) = √25 = 5</text></g>
<g class="a-ap" style="--d:3.90s"><text x="250.0" y="780.0" text-anchor="middle" font-size="22" font-weight="700" fill="#4A4870" >La raíz no se reparte en una suma.</text></g>
</svg>
