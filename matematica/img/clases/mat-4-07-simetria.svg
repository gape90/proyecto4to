<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-label="Circunferencia trigonométrica con los ángulos de 30°, 150°, 210° y 330°. Sus puntos son (0,87; 0,5), (−0,87; 0,5), (−0,87; −0,5) y (0,87; −0,5): son simétricos respecto de los ejes y solo cambian los signos." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<g class="a-ap" style="--d:0.00s"><line x1="250" y1="260" x2="750" y2="260" stroke="#4A4870" stroke-width="2.5"/><line x1="500" y1="30" x2="500" y2="490" stroke="#4A4870" stroke-width="2.5"/><circle cx="500" cy="260" r="190" fill="none" stroke="#E2DAF6" stroke-width="4"/></g>
<g class="a-ap" style="--d:0.40s"><line x1="500" y1="260" x2="664.5" y2="165.0" stroke="#4B4FA3" stroke-width="3.5"/><line x1="664.5" y1="165.0" x2="664.5" y2="260" stroke="#4B4FA3" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="664.5" cy="165.0" r="9" fill="#4B4FA3"/><text x="678.5" y="151.0" text-anchor="start" font-size="21" font-weight="800" fill="#4B4FA3" >(0,87; 0,5)</text><text x="678.5" y="125.0" text-anchor="start" font-size="21" font-weight="700" fill="#4B4FA3" >30°</text></g>
<g class="a-ap" style="--d:1.20s"><line x1="500" y1="260" x2="335.5" y2="165.0" stroke="#1F9D6B" stroke-width="3.5"/><line x1="335.5" y1="165.0" x2="335.5" y2="260" stroke="#1F9D6B" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="335.5" cy="165.0" r="9" fill="#1F9D6B"/><text x="321.5" y="151.0" text-anchor="end" font-size="21" font-weight="800" fill="#1F9D6B" >(−0,87; 0,5)</text><text x="321.5" y="125.0" text-anchor="end" font-size="21" font-weight="700" fill="#1F9D6B" >150°</text></g>
<g class="a-ap" style="--d:2.00s"><line x1="500" y1="260" x2="335.5" y2="355.0" stroke="#B26A00" stroke-width="3.5"/><line x1="335.5" y1="355.0" x2="335.5" y2="260" stroke="#B26A00" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="335.5" cy="355.0" r="9" fill="#B26A00"/><text x="321.5" y="377.0" text-anchor="end" font-size="21" font-weight="800" fill="#B26A00" >(−0,87; −0,5)</text><text x="321.5" y="403.0" text-anchor="end" font-size="21" font-weight="700" fill="#B26A00" >210°</text></g>
<g class="a-ap" style="--d:2.80s"><line x1="500" y1="260" x2="664.5" y2="355.0" stroke="#B83A7A" stroke-width="3.5"/><line x1="664.5" y1="355.0" x2="664.5" y2="260" stroke="#B83A7A" stroke-width="2.5" stroke-dasharray="6 5"/><circle cx="664.5" cy="355.0" r="9" fill="#B83A7A"/><text x="678.5" y="377.0" text-anchor="start" font-size="21" font-weight="800" fill="#B83A7A" >(0,87; −0,5)</text><text x="678.5" y="403.0" text-anchor="start" font-size="21" font-weight="700" fill="#B83A7A" >330°</text></g>
<g class="a-ap" style="--d:3.60s"><text x="500.0" y="504.0" text-anchor="middle" font-size="21" font-weight="700" fill="#4A4870" >Los cuatro puntos son simétricos: cambian los signos, no los valores.</text></g>
</svg>
