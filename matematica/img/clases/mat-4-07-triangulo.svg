<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-label="Triángulo rectángulo con un ángulo agudo α. La hipotenusa es el lado opuesto al ángulo recto; el cateto opuesto está enfrente de α y el cateto adyacente forma α junto con la hipotenusa. Seno de α es opuesto sobre hipotenusa; coseno de α es adyacente sobre hipotenusa." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<g class="a-ap" style="--d:0.00s"><polygon points="70,360 480,360 480,110" fill="#EFEAFB" stroke="#4A4870" stroke-width="3"/><rect x="454" y="334" width="26" height="26" fill="none" stroke="#4A4870" stroke-width="2.5"/><path d="M140 360 A70 70 0 0 0 129.8 323.6" fill="none" stroke="#1F9D6B" stroke-width="3"/><text x="162.0" y="344.0" text-anchor="middle" font-size="28" font-weight="800" fill="#1F9D6B" >α</text></g>
<g class="a-ap" style="--d:0.70s"><line x1="70" y1="360" x2="480" y2="110" stroke="#B83A7A" stroke-width="7" stroke-linecap="round"/><text x="235.0" y="219.0" text-anchor="middle" font-size="24" font-weight="800" fill="#B83A7A" transform="rotate(-31.4 235.0 219.0)">hipotenusa</text></g>
<g class="a-ap" style="--d:1.40s"><line x1="480" y1="360" x2="480" y2="110" stroke="#4B4FA3" stroke-width="7" stroke-linecap="round"/><text x="496.0" y="229.0" text-anchor="start" font-size="24" font-weight="800" fill="#4B4FA3" >cateto</text><text x="496.0" y="257.0" text-anchor="start" font-size="24" font-weight="800" fill="#4B4FA3" >opuesto a α</text></g>
<g class="a-ap" style="--d:2.10s"><line x1="70" y1="360" x2="480" y2="360" stroke="#B26A00" stroke-width="7" stroke-linecap="round"/><text x="275.0" y="398.0" text-anchor="middle" font-size="24" font-weight="800" fill="#B26A00" >cateto adyacente a α</text></g>
<g class="a-ap" style="--d:2.80s"><text x="780.0" y="110.0" text-anchor="middle" font-size="22" font-weight="800" fill="#4B4FA3" >sen α = opuesto / hipotenusa</text><text x="780.0" y="160.0" text-anchor="middle" font-size="22" font-weight="800" fill="#B26A00" >cos α = adyacente / hipotenusa</text></g>
</svg>
