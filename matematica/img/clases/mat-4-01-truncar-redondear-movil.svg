<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 800" role="img" aria-label="Ilustración: π escrito cifra por cifra, 3,14159265… Una línea corta el número después del tercer decimal y se marca la cifra siguiente, un 5. Truncar da 3,141 y redondear da 3,142." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<defs><marker id="fa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4B4FA3"/></marker><marker id="fv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1F9D6B"/></marker></defs>
<g class="a-ap" style="--d:0.00s"><text x="250" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#4A4870">π a 3 decimales</text></g>
<g class="a-ap" style="--d:0.20s"><rect x="58.7" y="72" width="158.2" height="56" rx="12" fill="#E6E7F6"/></g>
<g class="a-ap" style="--d:0.20s"><text x="82.7" y="112" text-anchor="middle" font-size="42" font-weight="800" fill="#1B1A4A">3</text><text x="103.8" y="112" text-anchor="middle" font-size="42" font-weight="800" fill="#1B1A4A">,</text><text x="124.9" y="112" text-anchor="middle" font-size="42" font-weight="800" fill="#1B1A4A">1</text><text x="158.9" y="112" text-anchor="middle" font-size="42" font-weight="800" fill="#1B1A4A">4</text><text x="192.9" y="112" text-anchor="middle" font-size="42" font-weight="800" fill="#1B1A4A">1</text><text x="242.2" y="112" text-anchor="middle" font-size="42" font-weight="800" fill="#B26A00">5</text><text x="281.3" y="112" text-anchor="middle" font-size="42" font-weight="800" fill="#9A97B8">9</text><text x="315.3" y="112" text-anchor="middle" font-size="42" font-weight="800" fill="#9A97B8">2</text><text x="349.3" y="112" text-anchor="middle" font-size="42" font-weight="800" fill="#9A97B8">6</text><text x="383.3" y="112" text-anchor="middle" font-size="42" font-weight="800" fill="#9A97B8">5</text><text x="417.3" y="112" text-anchor="middle" font-size="42" font-weight="800" fill="#9A97B8">…</text></g>
<line x1="217.5" y1="62" x2="217.5" y2="138" stroke="#B83A7A" stroke-width="4" class="a-trazo" style="--d:0.90s;--l:80"/>
<g class="a-ap" style="--d:1.40s"><circle cx="242.2" cy="96" r="23" fill="none" stroke="#B26A00" stroke-width="3"/><text x="242.2" y="160" text-anchor="middle" font-size="17" font-weight="700" fill="#B26A00">cifra siguiente</text></g>
<g class="a-ap" style="--d:2.00s"><rect x="30" y="190" width="440" height="270" rx="24" fill="#E6E7F6" stroke="#4B4FA3" stroke-opacity=".35" stroke-width="2"/><text x="250.0" y="236" text-anchor="middle" font-size="26" font-weight="800" fill="#4B4FA3">TRUNCAR</text><text x="250.0" y="274" text-anchor="middle" font-size="21" fill="#4A4870">Cortás y descartás las cifras</text><text x="250.0" y="302" text-anchor="middle" font-size="21" fill="#4A4870">que siguen, sin mirarlas.</text><text x="250.0" y="430" text-anchor="middle" font-size="48" font-weight="800" fill="#4B4FA3">3,141</text></g>
<g class="a-ap" style="--d:2.80s"><rect x="30" y="490" width="440" height="270" rx="24" fill="#E4F6EE" stroke="#1F9D6B" stroke-opacity=".35" stroke-width="2"/><text x="250.0" y="536" text-anchor="middle" font-size="26" font-weight="800" fill="#1F9D6B">REDONDEAR</text><text x="250.0" y="574" text-anchor="middle" font-size="21" fill="#4A4870">Mirás la cifra siguiente: es 5,</text><text x="250.0" y="602" text-anchor="middle" font-size="21" fill="#4A4870">así que la última cifra sube.</text><text x="250.0" y="730" text-anchor="middle" font-size="48" font-weight="800" fill="#1F9D6B">3,142</text></g>
</svg>
