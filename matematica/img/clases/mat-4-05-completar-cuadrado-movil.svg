<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 580" role="img" aria-label="Un cuadrado de lado x (área x²) y dos rectángulos de lados 3 y x (área 3x cada uno) se acomodan formando una L. Falta una esquina de 3 por 3, que vale 9. Al agregarla, queda un cuadrado de lado x + 3: x² + 6x + 9 = (x + 3)²." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<g class="a-ap" style="--d:0.00s"><rect x="110" y="70" width="160" height="160" fill="#E6E7F6" stroke="#4B4FA3" stroke-width="3"/><text x="190.0" y="159.0" text-anchor="middle" font-size="30" font-weight="800" fill="#4B4FA3" >x²</text><text x="190.0" y="58.0" text-anchor="middle" font-size="26" font-weight="800" fill="#4B4FA3" >x</text><text x="94.0" y="159.0" text-anchor="middle" font-size="26" font-weight="800" fill="#4B4FA3" >x</text></g>
<g class="a-plato" style="--d:0.60s;--gx:90px;--gy:0px"><rect x="270" y="70" width="64" height="160" fill="#E4F6EE" stroke="#1F9D6B" stroke-width="3"/><text x="302.0" y="159.0" text-anchor="middle" font-size="26" font-weight="800" fill="#1F9D6B" >3x</text><text x="302.0" y="58.0" text-anchor="middle" font-size="26" font-weight="800" fill="#1F9D6B" >3</text></g>
<g class="a-plato" style="--d:1.40s;--gx:0px;--gy:90px"><rect x="110" y="230" width="160" height="64" fill="#E4F6EE" stroke="#1F9D6B" stroke-width="3"/><text x="190.0" y="271.0" text-anchor="middle" font-size="26" font-weight="800" fill="#1F9D6B" >3x</text><text x="94.0" y="271.0" text-anchor="middle" font-size="26" font-weight="800" fill="#1F9D6B" >3</text></g>
<g class="a-ap" style="--d:2.60s"><rect x="270" y="230" width="64" height="64" fill="none" stroke="#B26A00" stroke-width="3" stroke-dasharray="8 6"/></g>
<g class="a-ap" style="--d:3.30s"><rect x="273" y="233" width="58" height="58" fill="#FFF3DC"/><text x="302.0" y="271.0" text-anchor="middle" font-size="26" font-weight="800" fill="#B26A00" >9</text></g>
<g class="a-ap" style="--d:3.80s"><line x1="110" y1="320" x2="334" y2="320" stroke="#B83A7A" stroke-width="4"/><text x="222.0" y="352.0" text-anchor="middle" font-size="26" font-weight="800" fill="#B83A7A" >x + 3</text></g>
<g class="a-ap" style="--d:1.00s"><text x="250.0" y="414.0" text-anchor="middle" font-size="24" font-weight="800" fill="#1B1A4A" >x² + 6x</text></g>
<g class="a-ap" style="--d:2.80s"><text x="250.0" y="462.0" text-anchor="middle" font-size="24" font-weight="800" fill="#B26A00" >Falta una esquina de 3 · 3 = 9</text></g>
<g class="a-ap" style="--d:4.20s"><text x="250.0" y="510.0" text-anchor="middle" font-size="24" font-weight="800" fill="#B83A7A" >x² + 6x + 9 = (x + 3)²</text></g>
</svg>
