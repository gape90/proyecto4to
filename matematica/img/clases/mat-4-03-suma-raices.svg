<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-label="Un cuadrado de área 9 (lado 3) y uno de área 16 (lado 4) puestos uno al lado del otro miden 7 de largo. Un cuadrado de área 9 + 16 = 25 tiene lado 5. Por eso √9 + √16 = 7, pero √(9 + 16) = 5." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<g class="a-ap" style="--d:0.20s"><rect x="80" y="232" width="138" height="138" fill="#E6E7F6" stroke="#4B4FA3" stroke-width="3"/><line x1="126" y1="232" x2="126" y2="370" stroke="#4B4FA3" stroke-opacity=".35" stroke-width="1.5"/><line x1="80" y1="278" x2="218" y2="278" stroke="#4B4FA3" stroke-opacity=".35" stroke-width="1.5"/><line x1="172" y1="232" x2="172" y2="370" stroke="#4B4FA3" stroke-opacity=".35" stroke-width="1.5"/><line x1="80" y1="324" x2="218" y2="324" stroke="#4B4FA3" stroke-opacity=".35" stroke-width="1.5"/></g>
<g class="a-ap" style="--d:0.40s"><text x="149.0" y="310.0" text-anchor="middle" font-size="26" font-weight="800" fill="#4B4FA3" >9</text></g>
<g class="a-ap" style="--d:0.80s"><rect x="218" y="186" width="184" height="184" fill="#E4F6EE" stroke="#1F9D6B" stroke-width="3"/><line x1="264" y1="186" x2="264" y2="370" stroke="#1F9D6B" stroke-opacity=".35" stroke-width="1.5"/><line x1="218" y1="232" x2="402" y2="232" stroke="#1F9D6B" stroke-opacity=".35" stroke-width="1.5"/><line x1="310" y1="186" x2="310" y2="370" stroke="#1F9D6B" stroke-opacity=".35" stroke-width="1.5"/><line x1="218" y1="278" x2="402" y2="278" stroke="#1F9D6B" stroke-opacity=".35" stroke-width="1.5"/><line x1="356" y1="186" x2="356" y2="370" stroke="#1F9D6B" stroke-opacity=".35" stroke-width="1.5"/><line x1="218" y1="324" x2="402" y2="324" stroke="#1F9D6B" stroke-opacity=".35" stroke-width="1.5"/></g>
<g class="a-ap" style="--d:1.00s"><text x="310.0" y="287.0" text-anchor="middle" font-size="26" font-weight="800" fill="#1F9D6B" >16</text></g>
<g class="a-ap" style="--d:1.50s"><line x1="80" y1="392" x2="402" y2="392" stroke="#B83A7A" stroke-width="4"/><line x1="80" y1="382" x2="80" y2="402" stroke="#B83A7A" stroke-width="4"/><line x1="402" y1="382" x2="402" y2="402" stroke="#B83A7A" stroke-width="4"/><text x="241.0" y="430.0" text-anchor="middle" font-size="22" font-weight="800" fill="#B83A7A" >lado 3 + lado 4 = 7</text></g>
<g class="a-ap" style="--d:1.90s"><text x="241.0" y="60.0" text-anchor="middle" font-size="28" font-weight="800" fill="#1B1A4A" >√9 + √16 = 3 + 4 = 7</text></g>
<g class="a-ap" style="--d:2.50s"><rect x="640" y="140" width="230" height="230" fill="#FFF3DC" stroke="#B26A00" stroke-width="3"/><line x1="686" y1="140" x2="686" y2="370" stroke="#B26A00" stroke-opacity=".35" stroke-width="1.5"/><line x1="640" y1="186" x2="870" y2="186" stroke="#B26A00" stroke-opacity=".35" stroke-width="1.5"/><line x1="732" y1="140" x2="732" y2="370" stroke="#B26A00" stroke-opacity=".35" stroke-width="1.5"/><line x1="640" y1="232" x2="870" y2="232" stroke="#B26A00" stroke-opacity=".35" stroke-width="1.5"/><line x1="778" y1="140" x2="778" y2="370" stroke="#B26A00" stroke-opacity=".35" stroke-width="1.5"/><line x1="640" y1="278" x2="870" y2="278" stroke="#B26A00" stroke-opacity=".35" stroke-width="1.5"/><line x1="824" y1="140" x2="824" y2="370" stroke="#B26A00" stroke-opacity=".35" stroke-width="1.5"/><line x1="640" y1="324" x2="870" y2="324" stroke="#B26A00" stroke-opacity=".35" stroke-width="1.5"/></g>
<g class="a-ap" style="--d:2.70s"><text x="755.0" y="264.0" text-anchor="middle" font-size="26" font-weight="800" fill="#B26A00" >25</text></g>
<g class="a-ap" style="--d:3.10s"><line x1="640" y1="392" x2="870" y2="392" stroke="#B83A7A" stroke-width="4"/><text x="755.0" y="430.0" text-anchor="middle" font-size="22" font-weight="800" fill="#B83A7A" >lado 5</text></g>
<g class="a-ap" style="--d:3.50s"><text x="755.0" y="60.0" text-anchor="middle" font-size="28" font-weight="800" fill="#1B1A4A" >√(9 + 16) = √25 = 5</text></g>
<g class="a-ap" style="--d:3.90s"><text x="500.0" y="484.0" text-anchor="middle" font-size="22" font-weight="700" fill="#4A4870" >7 y 5 no son iguales: la raíz no se reparte en una suma.</text></g>
</svg>
