<line x1="70.0" y1="280" x2="230.0" y2="120" stroke="#B83A7A" stroke-width="5" class="a-trazo" style="--d:1.20s;--l:236"/>
<g class="a-ap" style="--d:1.80s"><text x="132.0" y="190.0" text-anchor="middle" font-size="24" font-weight="800" fill="#B83A7A" >√2</text></g>
<path d="M230.0 120.0 A226.3 226.3 0 0 1 296.3 280" fill="none" stroke="#B26A00" stroke-width="3.5" stroke-dasharray="9 7" class="a-trazo" style="--d:2.40s;--l:188"/>
