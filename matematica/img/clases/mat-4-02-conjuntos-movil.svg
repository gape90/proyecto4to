<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 860" role="img" aria-label="Esquema de conjuntos: dentro de los números reales están los racionales, que incluyen a los enteros, que a su vez incluyen a los naturales. Al lado, sin superponerse, están los irracionales, como √2, π y √5." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<g class="a-ap" style="--d:0.00s"><rect x="8" y="8" width="484" height="844" rx="30" fill="#EFEAFB" stroke="#5B2A86" stroke-opacity=".3" stroke-width="2"/><text x="250.0" y="50.0" text-anchor="middle" font-size="28" font-weight="800" fill="#5B2A86" >Números reales</text></g>
<g class="a-ap" style="--d:0.50s"><ellipse cx="250" cy="300" rx="220" ry="220" fill="#fff" stroke="#4B4FA3" stroke-width="3"/><text x="250.0" y="118.0" text-anchor="middle" font-size="24" font-weight="800" fill="#4B4FA3" >Racionales</text><text x="60.0" y="310.0" text-anchor="middle" font-size="24" font-weight="700" fill="#1B1A4A" >1/2</text><text x="440.0" y="310.0" text-anchor="middle" font-size="24" font-weight="700" fill="#1B1A4A" >0,25</text><text x="250.0" y="158.0" text-anchor="middle" font-size="24" font-weight="700" fill="#1B1A4A" >−0,333…</text></g>
<g class="a-ap" style="--d:1.20s"><ellipse cx="250" cy="340" rx="160" ry="165" fill="#E4F6EE" stroke="#1F9D6B" stroke-width="3"/><text x="250.0" y="214.0" text-anchor="middle" font-size="24" font-weight="800" fill="#1F9D6B" >Enteros</text><text x="165.0" y="268.0" text-anchor="middle" font-size="24" font-weight="700" fill="#1B1A4A" >−3</text><text x="335.0" y="268.0" text-anchor="middle" font-size="24" font-weight="700" fill="#1B1A4A" >−10</text></g>
<g class="a-ap" style="--d:1.90s"><ellipse cx="250" cy="385" rx="90" ry="92" fill="#FFF3DC" stroke="#B26A00" stroke-width="3"/><text x="250.0" y="352.0" text-anchor="middle" font-size="24" font-weight="800" fill="#B26A00" >Naturales</text><text x="225.0" y="410.0" text-anchor="middle" font-size="24" font-weight="700" fill="#1B1A4A" >1</text><text x="275.0" y="410.0" text-anchor="middle" font-size="24" font-weight="700" fill="#1B1A4A" >7</text></g>
<g class="a-ap" style="--d:2.60s"><ellipse cx="250" cy="700" rx="200" ry="120" fill="#F6E3EE" stroke="#B83A7A" stroke-width="3"/><text x="250.0" y="640.0" text-anchor="middle" font-size="24" font-weight="800" fill="#B83A7A" >Irracionales</text><text x="170.0" y="712.0" text-anchor="middle" font-size="24" font-weight="700" fill="#1B1A4A" >√2</text><text x="250.0" y="742.0" text-anchor="middle" font-size="24" font-weight="700" fill="#1B1A4A" >π</text><text x="330.0" y="712.0" text-anchor="middle" font-size="24" font-weight="700" fill="#1B1A4A" >√5</text></g>
</svg>
