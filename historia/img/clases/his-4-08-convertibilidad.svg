<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="Infografía: en 1989 hubo hiperinflación y los precios cambiaban de un día para otro; en 1991 la convertibilidad estableció por ley que un peso valía un dólar, y la inflación bajó mucho" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<rect x="0" y="0" width="1000" height="470" rx="28" fill="#F7F4FD"/>
<text x="500" y="50" font-size="26" font-weight="800" fill="#1B1A4A" text-anchor="middle">De la hiperinflación a la convertibilidad</text>
<rect x="40" y="80" width="430" height="350" rx="24" fill="#FCEAEA"/>
<text x="255" y="130" font-size="40" font-weight="800" fill="#E5194F" text-anchor="middle">1989</text>
<text x="255" y="166" font-size="24" font-weight="800" fill="#E5194F" text-anchor="middle">Hiperinflación</text>
<g transform="translate(180,190)"><rect x="0" y="0" width="150" height="96" rx="14" fill="#fff" stroke="#E5194F" stroke-width="3"/><polyline points="14,80 44,64 74,58 104,34 134,14" fill="none" stroke="#E5194F" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M134 14 l-14 2 M134 14 l-2 14" stroke="#E5194F" stroke-width="5" stroke-linecap="round"/></g>
<text x="255" y="330" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">Los precios cambiaban</text>
<text x="255" y="354" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">de un día para otro y el dinero</text>
<text x="255" y="378" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">perdía su valor muy rápido.</text>
<path d="M486 255 h28 l-10 -12 M514 255 l-10 12" fill="none" stroke="#5B2A86" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="530" y="80" width="430" height="350" rx="24" fill="#E4F6EE"/>
<text x="745" y="130" font-size="40" font-weight="800" fill="#1F9D6B" text-anchor="middle">1991</text>
<text x="745" y="166" font-size="24" font-weight="800" fill="#1F9D6B" text-anchor="middle">Convertibilidad</text>
<g transform="translate(568,200)"><rect x="0" y="0" width="150" height="76" rx="10" fill="#fff" stroke="#4B4FA3" stroke-width="4"/><rect x="10" y="10" width="130" height="56" rx="6" fill="none" stroke="#4B4FA3" stroke-width="2" stroke-dasharray="4 4"/><text x="75" y="50" font-size="30" font-weight="800" fill="#4B4FA3" text-anchor="middle">$ 1</text></g>
<text x="745" y="248" font-size="40" font-weight="800" fill="#1B1A4A" text-anchor="middle">=</text>
<g transform="translate(772,200)"><rect x="0" y="0" width="150" height="76" rx="10" fill="#fff" stroke="#1F9D6B" stroke-width="4"/><rect x="10" y="10" width="130" height="56" rx="6" fill="none" stroke="#1F9D6B" stroke-width="2" stroke-dasharray="4 4"/><text x="75" y="50" font-size="30" font-weight="800" fill="#1F9D6B" text-anchor="middle">US$ 1</text></g>
<text x="745" y="330" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">Por ley, un peso valía un dólar</text>
<text x="745" y="354" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">("el uno a uno").</text>
<text x="745" y="378" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">La inflación bajó mucho.</text>
</svg>