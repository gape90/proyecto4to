<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="Esquema: Estado interventor y neoliberalismo, comparados en el rol del Estado, las empresas de servicios, el comercio exterior y los precios y salarios" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<rect x="0" y="0" width="1000" height="600" rx="28" fill="#F7F4FD"/>
<text x="480" y="60" font-size="24" font-weight="800" fill="#4B4FA3" text-anchor="middle">Estado interventor</text>
<text x="802" y="60" font-size="24" font-weight="800" fill="#B26A00" text-anchor="middle">Neoliberalismo</text>
<rect x="30" y="100" width="940" height="104" rx="20" fill="#fff" stroke="#E2DAF6" stroke-width="2"/>
<g transform="translate(46,122)"><path d="M0 18 L30 0 L60 18z" fill="#5B2A86"/><rect x="6" y="20" width="48" height="6" fill="#5B2A86"/><rect x="8" y="28" width="8" height="22" fill="#5B2A86"/><rect x="22" y="28" width="8" height="22" fill="#5B2A86"/><rect x="36" y="28" width="8" height="22" fill="#5B2A86"/><rect x="50" y="28" width="8" height="22" fill="#5B2A86"/><rect x="2" y="52" width="56" height="6" fill="#5B2A86"/></g>
<text x="122" y="147" font-size="18" font-weight="800" fill="#5B2A86" text-anchor="start">Rol</text>
<text x="122" y="169" font-size="18" font-weight="800" fill="#5B2A86" text-anchor="start">del Estado</text>
<rect x="330" y="116" width="300" height="72" rx="14" fill="#E6E7F6"/>
<text x="480" y="159.0" font-size="17" font-weight="700" fill="#4B4FA3" text-anchor="middle">Planifica y regula la economía</text>
<rect x="650" y="116" width="304" height="72" rx="14" fill="#FFF3DC"/>
<text x="802" y="159.0" font-size="17" font-weight="700" fill="#B26A00" text-anchor="middle">Interviene lo menos posible</text>
<rect x="30" y="220" width="940" height="104" rx="20" fill="#fff" stroke="#E2DAF6" stroke-width="2"/>
<g transform="translate(46,242)"><path d="M0 58 v-30 l18 -12 v12 l18 -12 v12 l18 -12 v42z" fill="#5B2A86"/><rect x="42" y="0" width="10" height="30" fill="#5B2A86"/></g>
<text x="122" y="267" font-size="18" font-weight="800" fill="#5B2A86" text-anchor="start">Empresas</text>
<text x="122" y="289" font-size="18" font-weight="800" fill="#5B2A86" text-anchor="start">de servicios</text>
<rect x="330" y="236" width="300" height="72" rx="14" fill="#E6E7F6"/>
<text x="480" y="279.0" font-size="17" font-weight="700" fill="#4B4FA3" text-anchor="middle">Muchas son del Estado</text>
<rect x="650" y="236" width="304" height="72" rx="14" fill="#FFF3DC"/>
<text x="802" y="279.0" font-size="17" font-weight="700" fill="#B26A00" text-anchor="middle">Se privatizan</text>
<rect x="30" y="340" width="940" height="104" rx="20" fill="#fff" stroke="#E2DAF6" stroke-width="2"/>
<g transform="translate(46,362)"><path d="M2 40 h56 l-8 14 h-40z" fill="#5B2A86"/><rect x="18" y="18" width="24" height="20" fill="#5B2A86"/><path d="M0 60 q10 -6 20 0 t20 0 t20 0" fill="none" stroke="#5B2A86" stroke-width="3"/></g>
<text x="122" y="387" font-size="18" font-weight="800" fill="#5B2A86" text-anchor="start">Comercio</text>
<text x="122" y="409" font-size="18" font-weight="800" fill="#5B2A86" text-anchor="start">exterior</text>
<rect x="330" y="356" width="300" height="72" rx="14" fill="#E6E7F6"/>
<text x="480" y="399.0" font-size="17" font-weight="700" fill="#4B4FA3" text-anchor="middle">Protege la industria nacional</text>
<rect x="650" y="356" width="304" height="72" rx="14" fill="#FFF3DC"/>
<text x="802" y="399.0" font-size="17" font-weight="700" fill="#B26A00" text-anchor="middle">Se abre a los productos de afuera</text>
<rect x="30" y="460" width="940" height="104" rx="20" fill="#fff" stroke="#E2DAF6" stroke-width="2"/>
<g transform="translate(46,482)"><path d="M8 4 h30 l18 18 -30 30 -18 -18z" fill="#5B2A86"/><circle cx="20" cy="16" r="5" fill="#fff"/><text x="34" y="40" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">$</text></g>
<text x="122" y="507" font-size="18" font-weight="800" fill="#5B2A86" text-anchor="start">Precios</text>
<text x="122" y="529" font-size="18" font-weight="800" fill="#5B2A86" text-anchor="start">y salarios</text>
<rect x="330" y="476" width="300" height="72" rx="14" fill="#E6E7F6"/>
<text x="480" y="519.0" font-size="17" font-weight="700" fill="#4B4FA3" text-anchor="middle">Los regula el Estado</text>
<rect x="650" y="476" width="304" height="72" rx="14" fill="#FFF3DC"/>
<text x="802" y="519.0" font-size="17" font-weight="700" fill="#B26A00" text-anchor="middle">Los fija el mercado</text>
</svg>