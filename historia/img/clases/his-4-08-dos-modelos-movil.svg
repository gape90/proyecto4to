<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 1060" role="img" aria-label="Esquema: Estado interventor y neoliberalismo, comparados en el rol del Estado, las empresas de servicios, el comercio exterior y los precios y salarios" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<rect x="0" y="0" width="500" height="1060" rx="28" fill="#F7F4FD"/>
<text x="250" y="48" font-size="26" font-weight="800" fill="#1B1A4A" text-anchor="middle">Dos modelos</text>
<rect x="40" y="70" width="18" height="18" rx="4" fill="#E6E7F6" stroke="#4B4FA3"/>
<text x="66" y="85" font-size="18" font-weight="800" fill="#4B4FA3" text-anchor="start">Estado interventor</text>
<rect x="270" y="70" width="18" height="18" rx="4" fill="#FFF3DC" stroke="#B26A00"/>
<text x="296" y="85" font-size="18" font-weight="800" fill="#B26A00" text-anchor="start">Neoliberalismo</text>
<rect x="20" y="110" width="460" height="220" rx="22" fill="#fff" stroke="#E2DAF6" stroke-width="2"/>
<g transform="translate(40,124)"><path d="M0 18 L30 0 L60 18z" fill="#5B2A86"/><rect x="6" y="20" width="48" height="6" fill="#5B2A86"/><rect x="8" y="28" width="8" height="22" fill="#5B2A86"/><rect x="22" y="28" width="8" height="22" fill="#5B2A86"/><rect x="36" y="28" width="8" height="22" fill="#5B2A86"/><rect x="50" y="28" width="8" height="22" fill="#5B2A86"/><rect x="2" y="52" width="56" height="6" fill="#5B2A86"/></g>
<text x="116" y="162" font-size="22" font-weight="800" fill="#5B2A86" text-anchor="start">Rol del Estado</text>
<rect x="40" y="194" width="420" height="56" rx="12" fill="#E6E7F6"/>
<text x="250" y="229" font-size="19" font-weight="700" fill="#4B4FA3" text-anchor="middle">Planifica y regula la economía</text>
<rect x="40" y="258" width="420" height="56" rx="12" fill="#FFF3DC"/>
<text x="250" y="293" font-size="19" font-weight="700" fill="#B26A00" text-anchor="middle">Interviene lo menos posible</text>
<rect x="20" y="346" width="460" height="220" rx="22" fill="#fff" stroke="#E2DAF6" stroke-width="2"/>
<g transform="translate(40,360)"><path d="M0 58 v-30 l18 -12 v12 l18 -12 v12 l18 -12 v42z" fill="#5B2A86"/><rect x="42" y="0" width="10" height="30" fill="#5B2A86"/></g>
<text x="116" y="398" font-size="22" font-weight="800" fill="#5B2A86" text-anchor="start">Empresas de servicios</text>
<rect x="40" y="430" width="420" height="56" rx="12" fill="#E6E7F6"/>
<text x="250" y="465" font-size="19" font-weight="700" fill="#4B4FA3" text-anchor="middle">Muchas son del Estado</text>
<rect x="40" y="494" width="420" height="56" rx="12" fill="#FFF3DC"/>
<text x="250" y="529" font-size="19" font-weight="700" fill="#B26A00" text-anchor="middle">Se privatizan</text>
<rect x="20" y="582" width="460" height="220" rx="22" fill="#fff" stroke="#E2DAF6" stroke-width="2"/>
<g transform="translate(40,596)"><path d="M2 40 h56 l-8 14 h-40z" fill="#5B2A86"/><rect x="18" y="18" width="24" height="20" fill="#5B2A86"/><path d="M0 60 q10 -6 20 0 t20 0 t20 0" fill="none" stroke="#5B2A86" stroke-width="3"/></g>
<text x="116" y="634" font-size="22" font-weight="800" fill="#5B2A86" text-anchor="start">Comercio exterior</text>
<rect x="40" y="666" width="420" height="56" rx="12" fill="#E6E7F6"/>
<text x="250" y="701" font-size="19" font-weight="700" fill="#4B4FA3" text-anchor="middle">Protege la industria nacional</text>
<rect x="40" y="730" width="420" height="56" rx="12" fill="#FFF3DC"/>
<text x="250" y="765" font-size="19" font-weight="700" fill="#B26A00" text-anchor="middle">Se abre a los productos de afuera</text>
<rect x="20" y="818" width="460" height="220" rx="22" fill="#fff" stroke="#E2DAF6" stroke-width="2"/>
<g transform="translate(40,832)"><path d="M8 4 h30 l18 18 -30 30 -18 -18z" fill="#5B2A86"/><circle cx="20" cy="16" r="5" fill="#fff"/><text x="34" y="40" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">$</text></g>
<text x="116" y="870" font-size="22" font-weight="800" fill="#5B2A86" text-anchor="start">Precios y salarios</text>
<rect x="40" y="902" width="420" height="56" rx="12" fill="#E6E7F6"/>
<text x="250" y="937" font-size="19" font-weight="700" fill="#4B4FA3" text-anchor="middle">Los regula el Estado</text>
<rect x="40" y="966" width="420" height="56" rx="12" fill="#FFF3DC"/>
<text x="250" y="1001" font-size="19" font-weight="700" fill="#B26A00" text-anchor="middle">Los fija el mercado</text>
</svg>