<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-label="Esquema circular: el Estado interviene, se protege la industria, suben los salarios, crece el consumo y eso impulsa más producción industrial" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<defs><marker id="pt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#5B2A86"/></marker></defs>
<rect x="0" y="0" width="1000" height="600" rx="28" fill="#F7F4FD"/>
<text x="500" y="304" font-size="24" font-weight="800" fill="#5B2A86" text-anchor="middle">El modelo</text>
<text x="500" y="334" font-size="24" font-weight="800" fill="#5B2A86" text-anchor="middle">económico peronista</text>
<g class="a-ap" style="--d:0.0s">
<rect x="350.0" y="60.0" width="300" height="120" rx="22" fill="#fff" stroke="#5B2A86" stroke-width="4"/>
<circle cx="356.0" cy="66.0" r="22" fill="#5B2A86"/>
<text x="356.0" y="74.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">1</text>
<text x="500" y="104" font-size="22" font-weight="800" fill="#5B2A86" text-anchor="middle">El Estado interviene</text>
<text x="500" y="134.0" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">Planifica y controla</text>
<text x="500" y="157.4" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">áreas clave</text>
</g>
<g class="a-ap" style="--d:0.5s"><path d="M640 150 Q760 170 780 228" fill="none" stroke="#5B2A86" stroke-width="4" marker-end="url(#pt)"/></g>
<g class="a-ap" style="--d:0.9s">
<rect x="640.0" y="240.0" width="300" height="120" rx="22" fill="#fff" stroke="#4B4FA3" stroke-width="4"/>
<circle cx="646.0" cy="246.0" r="22" fill="#4B4FA3"/>
<text x="646.0" y="254.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">2</text>
<text x="790" y="284" font-size="22" font-weight="800" fill="#4B4FA3" text-anchor="middle">Se protege la industria</text>
<text x="790" y="314.0" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">Produce para el</text>
<text x="790" y="337.4" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">mercado interno</text>
</g>
<g class="a-ap" style="--d:1.4s"><path d="M780 372 Q760 440 650 470" fill="none" stroke="#5B2A86" stroke-width="4" marker-end="url(#pt)"/></g>
<g class="a-ap" style="--d:1.8s">
<rect x="350.0" y="420.0" width="300" height="120" rx="22" fill="#fff" stroke="#B83A7A" stroke-width="4"/>
<circle cx="356.0" cy="426.0" r="22" fill="#B83A7A"/>
<text x="356.0" y="434.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">3</text>
<text x="500" y="464" font-size="22" font-weight="800" fill="#B83A7A" text-anchor="middle">Suben los salarios</text>
<text x="500" y="494.0" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">Más poder de compra</text>
<text x="500" y="517.4" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">y derechos</text>
</g>
<g class="a-ap" style="--d:2.3s"><path d="M350 470 Q240 440 220 372" fill="none" stroke="#5B2A86" stroke-width="4" marker-end="url(#pt)"/></g>
<g class="a-ap" style="--d:2.7s">
<rect x="60.0" y="240.0" width="300" height="120" rx="22" fill="#fff" stroke="#E5194F" stroke-width="4"/>
<circle cx="66.0" cy="246.0" r="22" fill="#E5194F"/>
<text x="66.0" y="254.0" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">4</text>
<text x="210" y="284" font-size="22" font-weight="800" fill="#E5194F" text-anchor="middle">Crece el consumo</text>
<text x="210" y="314.0" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">Más consumo impulsa</text>
<text x="210" y="337.4" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">más producción</text>
</g>
<g class="a-ap" style="--d:3.2s"><path d="M220 228 Q240 170 350 150" fill="none" stroke="#5B2A86" stroke-width="4" marker-end="url(#pt)"/></g>
</svg>