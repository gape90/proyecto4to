<path d="M306.3760786056716 190.48552873684054 h124 q-8 26 -62 26 q-54 0 -62 -26z" fill="#4B4FA3"/>
<text x="368.3760786056716" y="248.48552873684054" font-size="16" font-weight="700" fill="#4B4FA3" text-anchor="middle">Trabajadores</text>
