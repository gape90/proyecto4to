<g class="a-plato" style="--d:1.5s;--gx:3.6px;--gy:-29.5px">
<line x1="368.3760786056716" y1="569.5144712631595" x2="322.3760786056716" y2="639.5144712631595" stroke="#4A4870" stroke-width="2"/>
<line x1="368.3760786056716" y1="569.5144712631595" x2="414.3760786056716" y2="639.5144712631595" stroke="#4A4870" stroke-width="2"/>
<path d="M306.3760786056716 639.5144712631595 h124 q-8 26 -62 26 q-54 0 -62 -26z" fill="#4B4FA3"/>
<text x="368.3760786056716" y="697.5144712631595" font-size="16" font-weight="700" fill="#4B4FA3" text-anchor="middle">Trabajadores e</text>
<text x="368.3760786056716" y="719.1144712631595" font-size="16" font-weight="700" fill="#4B4FA3" text-anchor="middle">industria nacional</text>
