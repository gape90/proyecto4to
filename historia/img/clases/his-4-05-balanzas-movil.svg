<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 850" role="img" aria-label="Dos balanzas: entre 1930 y 1943 el Estado inclina la balanza hacia los grandes productores; entre 1943 y 1955, hacia los trabajadores" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<rect x="0" y="0" width="500" height="850" rx="28" fill="#F7F4FD"/>
