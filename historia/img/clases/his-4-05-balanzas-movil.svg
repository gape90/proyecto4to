<path d="M69.62392139432842 249.51447126315946 h124 q-8 26 -62 26 q-54 0 -62 -26z" fill="#B26A00"/>
<text x="131.62392139432842" y="307.51447126315946" font-size="16" font-weight="700" fill="#B26A00" text-anchor="middle">Grandes productores,</text>
<text x="131.62392139432842" y="329.1144712631595" font-size="16" font-weight="700" fill="#B26A00" text-anchor="middle">exportadores y empresas</text>
