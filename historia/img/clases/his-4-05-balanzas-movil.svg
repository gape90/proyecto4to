<text x="250" y="808" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">El plato que baja es el sector</text>
<text x="250" y="832" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">al que favorece el Estado.</text>
</svg>