<text x="250" y="450" font-size="24" font-weight="800" fill="#1B1A4A" text-anchor="middle">Estado peronista</text>
<text x="250" y="476" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">1943-1955</text>
