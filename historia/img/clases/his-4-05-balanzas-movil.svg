<g class="a-plato" style="--d:1.5s;--gx:-3.6px;--gy:29.5px">
<line x1="131.62392139432842" y1="510.48552873684054" x2="85.62392139432842" y2="580.4855287368405" stroke="#4A4870" stroke-width="2"/>
