<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" role="img" aria-label="Ilustración: la riqueza de un país es como una torta que se reparte entre salarios de los trabajadores y ganancias y rentas de los dueños; el Estado pone las reglas del reparto" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<rect x="0" y="0" width="1000" height="540" rx="28" fill="#F7F4FD"/>
<text x="500" y="56" font-size="30" font-weight="800" fill="#1B1A4A" text-anchor="middle">La riqueza de un país, como una torta</text>
<g>
  <ellipse cx="270" cy="308" rx="190" ry="117.8" fill="#C98B5A"/>
  <path d="M270 290 L270 172.2 A190 117.8 0 0 0 270 407.8z" fill="#4B4FA3" opacity=".88"/>
  <path d="M270 290 L270 172.2 A190 117.8 0 0 1 270 407.8z" fill="#B83A7A" opacity=".88"/>
  <ellipse cx="270" cy="290" rx="190" ry="117.8" fill="none" stroke="#C98B5A" stroke-width="4"/>
  <line x1="270" y1="172.2" x2="270" y2="407.8" stroke="#fff" stroke-width="5" stroke-dasharray="10 6"/>
  <path d="M226 156.2 q44 -30 88 0" fill="none" stroke="#1B1A4A" stroke-width="4" stroke-linecap="round"/>
  <path d="M226 156.2 l4 -14 M226 156.2 l14 2 M314 156.2 l-4 -14 M314 156.2 l-14 2" fill="none" stroke="#1B1A4A" stroke-width="4" stroke-linecap="round"/>
</g>
<rect x="520" y="142" width="26" height="26" rx="6" fill="#4B4FA3"/>
<text x="558" y="160.0" font-size="21" font-weight="700" fill="#1B1A4A" text-anchor="start">Salarios</text>
<text x="558" y="187.3" font-size="21" font-weight="700" fill="#1B1A4A" text-anchor="start">(para los trabajadores)</text>
<rect x="520" y="232" width="26" height="26" rx="6" fill="#B83A7A"/>
<text x="558" y="250.0" font-size="21" font-weight="700" fill="#1B1A4A" text-anchor="start">Ganancias y rentas</text>
<text x="558" y="277.3" font-size="21" font-weight="700" fill="#1B1A4A" text-anchor="start">(para los dueños de las empresas</text>
<text x="558" y="304.6" font-size="21" font-weight="700" fill="#1B1A4A" text-anchor="start">y de la tierra)</text>
<g transform="translate(520,335)"><circle cx="30" cy="20" r="18" fill="#5B2A86"/><rect x="10" y="42" width="40" height="74" rx="16" fill="#5B2A86"/>
  <rect x="44" y="52" width="54" height="40" rx="4" fill="#fff" stroke="#5B2A86" stroke-width="4"/><line x1="71" y1="52" x2="71" y2="92" stroke="#5B2A86" stroke-width="3"/>
  <line x1="50" y1="64" x2="66" y2="64" stroke="#5B2A86" stroke-width="2"/><line x1="50" y1="72" x2="66" y2="72" stroke="#5B2A86" stroke-width="2"/><line x1="76" y1="64" x2="92" y2="64" stroke="#5B2A86" stroke-width="2"/><line x1="76" y1="72" x2="92" y2="72" stroke="#5B2A86" stroke-width="2"/></g>
<text x="640" y="385.0" font-size="21" font-weight="700" fill="#5B2A86" text-anchor="start">El Estado puede poner</text>
<text x="640" y="412.3" font-size="21" font-weight="700" fill="#5B2A86" text-anchor="start">las reglas del reparto</text>
<text x="500" y="512" font-size="19" font-weight="600" fill="#4A4870" text-anchor="middle">¿Dónde se corta? Depende de la fuerza de cada grupo y de lo que decide el Estado.</text>
</svg>