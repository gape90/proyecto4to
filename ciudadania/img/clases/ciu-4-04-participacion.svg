<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-label="Mapa conceptual. Participar en los asuntos públicos se puede de tres maneras. Por medio de representantes: votando y a través de los partidos políticos (artículos 37 y 38). De forma directa: con la iniciativa popular, para presentar proyectos de ley (artículo 39), y con la consulta popular (artículo 40). Ejerciendo derechos: peticionar a las autoridades y asociarse (artículo 14)." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
