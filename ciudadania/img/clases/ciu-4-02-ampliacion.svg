<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-label="Esquema de tres óvalos, uno dentro del otro, que muestran cómo se amplió el derecho al voto. En el centro, 1912, Ley Sáenz Peña: varones argentinos nativos mayores de 18 años. Alrededor, 1947, Ley 13.010: también las mujeres, que votan por primera vez en 1951. Afuera, 2012, Ley 26.774: también jóvenes de 16 y 17 años, nativos o por opción, desde 2013." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<defs></defs>
<rect x="0" y="0" width="1000" height="650" rx="28" fill="#F7F4FD"/>
<g class="a-ap" style="--d:1.9s"><ellipse cx="500" cy="335" rx="475" ry="295" fill="#E8641B" fill-opacity="0.1" stroke="#E8641B" stroke-width="4"/><text x="500" y="86" font-size="22" font-weight="800" fill="#E8641B" text-anchor="middle">2012 · Ley 26.774</text><text x="500" y="112.0" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">También jóvenes de 16 y 17 años,</text><text x="500" y="136.3" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">nativos o por opción (desde 2013)</text></g><g class="a-ap" style="--d:1.1s"><ellipse cx="500" cy="335" rx="350" ry="180" fill="#B83A7A" fill-opacity="0.1" stroke="#B83A7A" stroke-width="4"/><text x="500" y="195" font-size="22" font-weight="800" fill="#B83A7A" text-anchor="middle">1947 · Ley 13.010</text><text x="500" y="221.0" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">También las mujeres</text><text x="500" y="245.3" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">(votan por primera vez en 1951)</text></g><g class="a-ap" style="--d:0.3s"><ellipse cx="500" cy="335" rx="220" ry="72" fill="#5B2A86" fill-opacity="0.16" stroke="#5B2A86" stroke-width="4"/><text x="500" y="321" font-size="22" font-weight="800" fill="#5B2A86" text-anchor="middle">1912 · Ley Sáenz Peña</text><text x="500" y="347.0" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">Varones argentinos nativos</text><text x="500" y="371.3" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">mayores de 18 años</text></g>
</svg>
