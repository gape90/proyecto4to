<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 740" role="img" aria-label="Esquema de tres óvalos, uno dentro del otro, que muestran cómo se amplió el derecho al voto. En el centro, 1912, Ley Sáenz Peña: varones argentinos nativos mayores de 18 años. Alrededor, 1947, Ley 13.010: también las mujeres, que votan por primera vez en 1951. Afuera, 2012, Ley 26.774: también jóvenes de 16 y 17 años, nativos o por opción, desde 2013." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<defs></defs>
<rect x="0" y="0" width="520" height="740" rx="28" fill="#F7F4FD"/>
<g class="a-ap" style="--d:1.9s"><ellipse cx="260" cy="380" rx="255" ry="335" fill="#E8641B" fill-opacity="0.1" stroke="#E8641B" stroke-width="4"/><text x="260" y="91" font-size="20" font-weight="800" fill="#E8641B" text-anchor="middle">2012 · Ley 26.774</text><text x="260" y="117.0" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">También jóvenes de 16 y 17 años,</text><text x="260" y="138.6" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">nativos o por opción (desde 2013)</text></g><g class="a-ap" style="--d:1.1s"><ellipse cx="260" cy="380" rx="215" ry="210" fill="#B83A7A" fill-opacity="0.1" stroke="#B83A7A" stroke-width="4"/><text x="260" y="210" font-size="20" font-weight="800" fill="#B83A7A" text-anchor="middle">1947 · Ley 13.010</text><text x="260" y="236.0" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">También las mujeres</text><text x="260" y="257.6" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">(votan por primera vez en 1951)</text></g><g class="a-ap" style="--d:0.3s"><ellipse cx="260" cy="380" rx="150" ry="90" fill="#5B2A86" fill-opacity="0.16" stroke="#5B2A86" stroke-width="4"/><text x="260" y="366" font-size="20" font-weight="800" fill="#5B2A86" text-anchor="middle">1912 · Ley Sáenz Peña</text><text x="260" y="392.0" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">Varones argentinos nativos</text><text x="260" y="413.6" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">mayores de 18 años</text></g>
</svg>
