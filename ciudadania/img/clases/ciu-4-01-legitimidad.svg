<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-label="Esquema de las tres fuentes de legitimidad según Max Weber. Tradición: se acepta porque siempre fue así, por ejemplo, los abuelos deciden cómo se celebra cada año. Carisma: se acepta por admiración a las cualidades de alguien, por ejemplo, el equipo sigue a la capitana porque confía en ella. Reglas: se acepta porque la persona llegó al cargo por el camino que fijan las normas, por ejemplo, quien preside el centro de estudiantes ganó una votación." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<defs></defs>
<rect x="0" y="0" width="1000" height="470" rx="28" fill="#F7F4FD"/>
<g class="a-ap" style="--d:0.0s"><rect x="300" y="20" width="400" height="60" rx="20" fill="#5B2A86"/><text x="500" y="58" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">¿Por qué se acepta un poder?</text></g><g class="a-ap" style="--d:0.5s"><path d="M500 82 Q175 92 175 124" stroke="#5B2A86" stroke-width="4" fill="none"/><rect x="30" y="128" width="290" height="320" rx="22" fill="#fff" stroke="#5B2A86" stroke-width="4"/><circle cx="175" cy="186" r="38" fill="#5B2A86" fill-opacity=".12"/><path d="M159 164 h32 l-14 22 l14 22 h-32 l14 -22 z" fill="none" stroke="#5B2A86" stroke-width="4" stroke-linejoin="round"/><path d="M168 202 h14 l-7 -8z" fill="#5B2A86"/><text x="175" y="256" font-size="24" font-weight="800" fill="#5B2A86" text-anchor="middle">Tradición</text><text x="175" y="292.0" font-size="16" font-weight="700" fill="#4A4870" text-anchor="middle">Se acepta porque</text><text x="175" y="312.8" font-size="16" font-weight="700" fill="#4A4870" text-anchor="middle">siempre fue así.</text><line x1="60" y1="340" x2="290" y2="340" stroke="#5B2A86" stroke-opacity=".3" stroke-width="2"/><text x="175" y="370" font-size="15" font-weight="800" fill="#5B2A86" text-anchor="middle">Por ejemplo:</text><text x="175" y="396.0" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">Los abuelos deciden cómo</text><text x="175" y="415.5" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">se celebra cada año.</text></g><g class="a-ap" style="--d:1.0s"><path d="M500 82 Q495 92 495 124" stroke="#B83A7A" stroke-width="4" fill="none"/><rect x="350" y="128" width="290" height="320" rx="22" fill="#fff" stroke="#B83A7A" stroke-width="4"/><circle cx="495" cy="186" r="38" fill="#B83A7A" fill-opacity=".12"/><polygon points="495.0,164.0 500.3,178.7 515.9,179.2 503.6,188.8 507.9,203.8 495.0,195.0 482.1,203.8 486.4,188.8 474.1,179.2 489.7,178.7" fill="#B83A7A"/><text x="495" y="256" font-size="24" font-weight="800" fill="#B83A7A" text-anchor="middle">Carisma</text><text x="495" y="292.0" font-size="16" font-weight="700" fill="#4A4870" text-anchor="middle">Se acepta por admiración</text><text x="495" y="312.8" font-size="16" font-weight="700" fill="#4A4870" text-anchor="middle">a las cualidades de alguien.</text><line x1="380" y1="340" x2="610" y2="340" stroke="#B83A7A" stroke-opacity=".3" stroke-width="2"/><text x="495" y="370" font-size="15" font-weight="800" fill="#B83A7A" text-anchor="middle">Por ejemplo:</text><text x="495" y="396.0" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">El equipo sigue a la capitana</text><text x="495" y="415.5" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">porque confía en ella.</text></g><g class="a-ap" style="--d:1.5s"><path d="M500 82 Q815 92 815 124" stroke="#4B4FA3" stroke-width="4" fill="none"/><rect x="670" y="128" width="290" height="320" rx="22" fill="#fff" stroke="#4B4FA3" stroke-width="4"/><circle cx="815" cy="186" r="38" fill="#4B4FA3" fill-opacity=".12"/><rect x="795" y="174" width="40" height="32" rx="4" fill="none" stroke="#4B4FA3" stroke-width="4"/><rect x="806" y="172" width="18" height="5" fill="#4B4FA3"/><path d="M809 160 h12 v14 h-12z" fill="#fff" stroke="#4B4FA3" stroke-width="3"/><text x="815" y="256" font-size="24" font-weight="800" fill="#4B4FA3" text-anchor="middle">Reglas</text><text x="815" y="292.0" font-size="16" font-weight="700" fill="#4A4870" text-anchor="middle">Se acepta porque llegó al cargo</text><text x="815" y="312.8" font-size="16" font-weight="700" fill="#4A4870" text-anchor="middle">por el camino que fijan las normas.</text><line x1="700" y1="340" x2="930" y2="340" stroke="#4B4FA3" stroke-opacity=".3" stroke-width="2"/><text x="815" y="370" font-size="15" font-weight="800" fill="#4B4FA3" text-anchor="middle">Por ejemplo:</text><text x="815" y="396.0" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">Quien preside el centro de</text><text x="815" y="415.5" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">estudiantes ganó una votación.</text></g>
</svg>
