<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-label="Infografía de las reglas de tránsito que rigen en Santa Fe. En grande: en Santa Fe, 18 años para cualquier licencia, según la Ley provincial 13.133. Más chico: la ley nacional 24.449 permite desde los 16 y 17 años. Cuatro reglas: casco en moto y bicicleta, cinturón para todas las personas que viajan en el auto, celular prohibido mientras se maneja y alcohol cero en rutas nacionales (Ley 27.714)." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<defs></defs>
<rect x="0" y="0" width="1000" height="500" rx="28" fill="#F7F4FD"/>
<g class="a-ap" style="--d:0.0s"><text x="500" y="40" font-size="24" font-weight="800" fill="#5B2A86" text-anchor="middle">Las reglas que rigen en Santa Fe</text></g><g class="a-ap" style="--d:0.4s"><rect x="170" y="66" width="660" height="150" rx="24" fill="#5B2A86" fill-opacity=".09" stroke="#5B2A86" stroke-width="3"/><text x="290" y="164" font-size="84" font-weight="800" fill="#5B2A86" text-anchor="middle">18</text><text x="290" y="196" font-size="18" font-weight="700" fill="#5B2A86" text-anchor="middle">años</text><text x="590" y="118" font-size="22" font-weight="700" fill="#4A4870" text-anchor="middle">En Santa Fe, para</text><text x="590" y="148" font-size="26" font-weight="800" fill="#4A4870" text-anchor="middle">cualquier licencia</text><text x="590" y="180" font-size="17" font-weight="600" fill="#4A4870" text-anchor="middle">Ley provincial 13.133</text></g><g class="a-ap" style="--d:0.9s"><text x="500" y="248" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">La ley nacional 24.449 permite desde los 16 y 17 años, pero en Santa Fe rige la ley provincial.</text></g><g class="a-ap" style="--d:1.4s"><rect x="35" y="280" width="210" height="200" rx="22" fill="#fff" stroke="#E8641B" stroke-width="3"/><path d="M106 364 Q106 320 140 320 Q174 320 174 364 Z" fill="#E8641B"/><rect x="102" y="362" width="76" height="10" rx="5" fill="#E8641B"/><path d="M130 322 L136 360" stroke="#fff" stroke-width="4"/><text x="140" y="425" font-size="21" font-weight="800" fill="#4A4870" text-anchor="middle">Casco</text><text x="140" y="453" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">en moto y bicicleta</text></g><g class="a-ap" style="--d:1.8s"><rect x="275" y="280" width="210" height="200" rx="22" fill="#fff" stroke="#4B4FA3" stroke-width="3"/><rect x="354" y="316" width="52" height="68" rx="14" fill="none" stroke="#4B4FA3" stroke-width="6"/><path d="M354 320 L406 380" stroke="#4B4FA3" stroke-width="9" stroke-linecap="round"/><rect x="372" y="344" width="16" height="12" rx="3" fill="#fff" stroke="#4B4FA3" stroke-width="3"/><text x="380" y="425" font-size="21" font-weight="800" fill="#4A4870" text-anchor="middle">Cinturón</text><text x="380" y="453" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">para todos en el auto</text></g><g class="a-ap" style="--d:2.1s"><rect x="515" y="280" width="210" height="200" rx="22" fill="#fff" stroke="#B83A7A" stroke-width="3"/><rect x="602" y="318" width="36" height="64" rx="8" fill="none" stroke="#B83A7A" stroke-width="6"/><circle cx="620" cy="350" r="38" fill="none" stroke="#E5194F" stroke-width="6"/><path d="M593 323 L647 377" stroke="#E5194F" stroke-width="6"/><text x="620" y="425" font-size="21" font-weight="800" fill="#4A4870" text-anchor="middle">Sin celular</text><text x="620" y="453" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">mientras se maneja</text></g><g class="a-ap" style="--d:2.4s"><rect x="755" y="280" width="210" height="200" rx="22" fill="#fff" stroke="#1F9D6B" stroke-width="3"/><path d="M838 318 L882 318 L876 380 L844 380 Z" fill="none" stroke="#1F9D6B" stroke-width="6" stroke-linejoin="round"/><text x="860" y="362" font-size="34" font-weight="800" fill="#1F9D6B" text-anchor="middle">0</text><text x="860" y="425" font-size="21" font-weight="800" fill="#4A4870" text-anchor="middle">Alcohol cero</text><text x="860" y="453" font-size="15" font-weight="600" fill="#4A4870" text-anchor="middle">en rutas nacionales</text></g>
</svg>
