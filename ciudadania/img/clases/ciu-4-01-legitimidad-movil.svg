<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 1010" role="img" aria-label="Esquema de las tres fuentes de legitimidad según Max Weber. Tradición: se acepta porque siempre fue así, por ejemplo, los abuelos deciden cómo se celebra cada año. Carisma: se acepta por admiración a las cualidades de alguien, por ejemplo, el equipo sigue a la capitana porque confía en ella. Reglas: se acepta porque la persona llegó al cargo por el camino que fijan las normas, por ejemplo, quien preside el centro de estudiantes ganó una votación." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<defs></defs>
<rect x="0" y="0" width="520" height="1010" rx="28" fill="#F7F4FD"/>
<g class="a-ap" style="--d:0.0s"><rect x="40" y="20" width="440" height="60" rx="20" fill="#5B2A86"/><text x="260" y="58" font-size="22" font-weight="800" fill="#fff" text-anchor="middle">¿Por qué se acepta un poder?</text></g><g class="a-ap" style="--d:0.5s"><rect x="30" y="100" width="460" height="280" rx="22" fill="#fff" stroke="#5B2A86" stroke-width="4"/><circle cx="260" cy="152" r="34" fill="#5B2A86" fill-opacity=".12"/><path d="M244 130 h32 l-14 22 l14 22 h-32 l14 -22 z" fill="none" stroke="#5B2A86" stroke-width="4" stroke-linejoin="round"/><path d="M253 168 h14 l-7 -8z" fill="#5B2A86"/><text x="260" y="222" font-size="26" font-weight="800" fill="#5B2A86" text-anchor="middle">Tradición</text><text x="260" y="258.0" font-size="19" font-weight="700" fill="#4A4870" text-anchor="middle">Se acepta porque</text><text x="260" y="282.7" font-size="19" font-weight="700" fill="#4A4870" text-anchor="middle">siempre fue así.</text><text x="260" y="322" font-size="17" font-weight="800" fill="#5B2A86" text-anchor="middle">Por ejemplo:</text><text x="260" y="348.0" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">Los abuelos deciden cómo se celebra cada año.</text></g><g class="a-ap" style="--d:1.0s"><rect x="30" y="400" width="460" height="280" rx="22" fill="#fff" stroke="#B83A7A" stroke-width="4"/><circle cx="260" cy="452" r="34" fill="#B83A7A" fill-opacity=".12"/><polygon points="260.0,430.0 265.3,444.7 280.9,445.2 268.6,454.8 272.9,469.8 260.0,461.0 247.1,469.8 251.4,454.8 239.1,445.2 254.7,444.7" fill="#B83A7A"/><text x="260" y="522" font-size="26" font-weight="800" fill="#B83A7A" text-anchor="middle">Carisma</text><text x="260" y="558.0" font-size="19" font-weight="700" fill="#4A4870" text-anchor="middle">Se acepta por admiración</text><text x="260" y="582.7" font-size="19" font-weight="700" fill="#4A4870" text-anchor="middle">a las cualidades de alguien.</text><text x="260" y="622" font-size="17" font-weight="800" fill="#B83A7A" text-anchor="middle">Por ejemplo:</text><text x="260" y="648.0" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">El equipo sigue a la capitana porque confía en ella.</text></g><g class="a-ap" style="--d:1.5s"><rect x="30" y="700" width="460" height="280" rx="22" fill="#fff" stroke="#4B4FA3" stroke-width="4"/><circle cx="260" cy="752" r="34" fill="#4B4FA3" fill-opacity=".12"/><rect x="240" y="740" width="40" height="32" rx="4" fill="none" stroke="#4B4FA3" stroke-width="4"/><rect x="251" y="738" width="18" height="5" fill="#4B4FA3"/><path d="M254 726 h12 v14 h-12z" fill="#fff" stroke="#4B4FA3" stroke-width="3"/><text x="260" y="822" font-size="26" font-weight="800" fill="#4B4FA3" text-anchor="middle">Reglas</text><text x="260" y="858.0" font-size="19" font-weight="700" fill="#4A4870" text-anchor="middle">Se acepta porque llegó al cargo</text><text x="260" y="882.7" font-size="19" font-weight="700" fill="#4A4870" text-anchor="middle">por el camino que fijan las normas.</text><text x="260" y="922" font-size="17" font-weight="800" fill="#4B4FA3" text-anchor="middle">Por ejemplo:</text><text x="260" y="948.0" font-size="16" font-weight="600" fill="#4A4870" text-anchor="middle">Quien preside el centro de estudiantes ganó una votación.</text></g>
</svg>
