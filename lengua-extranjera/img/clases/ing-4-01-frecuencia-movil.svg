<g class="a-ap" style="--d:1.20s"><text x="40" y="317" font-size="24" font-weight="800" fill="#B83A7A">often</text><text x="460" y="317" font-size="18" font-weight="600" fill="#4A4870" text-anchor="end">seguido</text><rect x="40" y="331" width="420" height="26" rx="13" fill="#E6E0F3"/><rect x="40" y="331" width="252" height="26" rx="13" fill="#B83A7A"/></g>
