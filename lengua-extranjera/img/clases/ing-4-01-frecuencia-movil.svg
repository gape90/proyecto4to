<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" role="img" aria-label="Escala de frecuencia: always, siempre; usually, casi siempre; often, seguido; sometimes, a veces; never, nunca" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
