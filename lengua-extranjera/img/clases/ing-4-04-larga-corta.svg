<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-label="Línea de tiempo: una barra larga, I was reading, acción larga en pasado continuo; un rayo la corta en el medio, when the phone rang, acción corta en pasado simple" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<rect x="0" y="0" width="900" height="380" rx="28" fill="#F7F4FD"/>
<defs><marker id="pt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#4A4870"/></marker></defs>
<text x="450.0" y="52" font-size="26" font-weight="800" fill="#5B2A86" text-anchor="middle">Una acción larga y una corta</text>
<path d="M 40 260 H 860" stroke="#4A4870" stroke-width="3" marker-end="url(#pt)"/><text x="860" y="288" font-size="16" font-weight="600" fill="#4A4870" text-anchor="end">tiempo →</text>
<g class="a-ap" style="--d:0.3s"><rect x="60" y="200" width="740" height="40" rx="20" fill="#5B2A86"/><text x="80" y="186" font-size="24" font-weight="800" fill="#5B2A86">I was reading…</text><text x="80" y="328" font-size="17" font-weight="600" fill="#4A4870">acción larga: pasado continuo</text></g>
<g class="a-ap" style="--d:1.6s"><path d="M 468.0 130 L 442.0 218 L 460.0 218 L 436.0 290" stroke="#E07A2E" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="480.0" y="122" font-size="24" font-weight="800" fill="#E07A2E" text-anchor="start">…when the phone rang.</text><text x="840" y="328" font-size="17" font-weight="600" fill="#4A4870" text-anchor="end">acción corta: pasado simple</text></g>
</svg>
