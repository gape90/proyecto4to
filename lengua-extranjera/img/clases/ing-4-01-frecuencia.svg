<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-label="Escala de frecuencia: always, siempre; usually, casi siempre; often, seguido; sometimes, a veces; never, nunca" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<rect x="0" y="0" width="900" height="500" rx="28" fill="#F7F4FD"/>
<text x="450.0" y="52" font-size="28" font-weight="800" fill="#5B2A86" text-anchor="middle">¿Con qué frecuencia?</text>
<g class="a-ap" style="--d:0.30s"><text x="60" y="121" font-size="26" font-weight="800" fill="#5B2A86">always</text><text x="60" y="147" font-size="18" font-weight="600" fill="#4A4870">siempre</text><rect x="300" y="105" width="540" height="34" rx="17" fill="#E6E0F3"/><rect x="300" y="105" width="540" height="34" rx="17" fill="#5B2A86"/></g>
<g class="a-ap" style="--d:0.75s"><text x="60" y="199" font-size="26" font-weight="800" fill="#4B4FA3">usually</text><text x="60" y="225" font-size="18" font-weight="600" fill="#4A4870">casi siempre</text><rect x="300" y="183" width="540" height="34" rx="17" fill="#E6E0F3"/><rect x="300" y="183" width="432" height="34" rx="17" fill="#4B4FA3"/></g>
<g class="a-ap" style="--d:1.20s"><text x="60" y="277" font-size="26" font-weight="800" fill="#B83A7A">often</text><text x="60" y="303" font-size="18" font-weight="600" fill="#4A4870">seguido</text><rect x="300" y="261" width="540" height="34" rx="17" fill="#E6E0F3"/><rect x="300" y="261" width="324" height="34" rx="17" fill="#B83A7A"/></g>
<g class="a-ap" style="--d:1.65s"><text x="60" y="355" font-size="26" font-weight="800" fill="#E07A2E">sometimes</text><text x="60" y="381" font-size="18" font-weight="600" fill="#4A4870">a veces</text><rect x="300" y="339" width="540" height="34" rx="17" fill="#E6E0F3"/><rect x="300" y="339" width="189" height="34" rx="17" fill="#E07A2E"/></g>
<g class="a-ap" style="--d:2.10s"><text x="60" y="433" font-size="26" font-weight="800" fill="#4A4870">never</text><text x="60" y="459" font-size="18" font-weight="600" fill="#4A4870">nunca</text><rect x="300" y="417" width="540" height="34" rx="17" fill="#E6E0F3"/></g>
