<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-label="Escala de gustos con cinco caras: love, me encanta; like, me gusta; don't mind, me da igual; don't like, no me gusta; hate, odio" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<rect x="0" y="0" width="900" height="360" rx="28" fill="#F7F4FD"/>
<defs><marker id="pt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#4A4870"/></marker></defs>
<text x="450.0" y="52" font-size="26" font-weight="800" fill="#5B2A86" text-anchor="middle">¿Cuánto te gusta?</text>
<g class="a-ap" style="--d:0.30s"><circle cx="110" cy="150" r="40" fill="#fff" stroke="#5B2A86" stroke-width="5"/><circle cx="99" cy="142" r="4.5" fill="#5B2A86"/><circle cx="121" cy="142" r="4.5" fill="#5B2A86"/><path d="M -14 8 Q 0 24 14 8" transform="translate(110 150)" stroke="#5B2A86" stroke-width="5" fill="none" stroke-linecap="round"/><text x="110" y="230" font-size="24" font-weight="800" fill="#5B2A86" text-anchor="middle">love</text><text x="110" y="258" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">me encanta</text></g>
<g class="a-ap" style="--d:0.70s"><circle cx="280" cy="150" r="40" fill="#fff" stroke="#4B4FA3" stroke-width="5"/><circle cx="269" cy="142" r="4.5" fill="#4B4FA3"/><circle cx="291" cy="142" r="4.5" fill="#4B4FA3"/><path d="M -12 10 Q 0 18 12 10" transform="translate(280 150)" stroke="#4B4FA3" stroke-width="5" fill="none" stroke-linecap="round"/><text x="280" y="230" font-size="24" font-weight="800" fill="#4B4FA3" text-anchor="middle">like</text><text x="280" y="258" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">me gusta</text></g>
<g class="a-ap" style="--d:1.10s"><circle cx="450" cy="150" r="40" fill="#fff" stroke="#B83A7A" stroke-width="5"/><circle cx="439" cy="142" r="4.5" fill="#B83A7A"/><circle cx="461" cy="142" r="4.5" fill="#B83A7A"/><path d="M -12 12 L 12 12" transform="translate(450 150)" stroke="#B83A7A" stroke-width="5" fill="none" stroke-linecap="round"/><text x="450" y="230" font-size="24" font-weight="800" fill="#B83A7A" text-anchor="middle">don't mind</text><text x="450" y="258" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">me da igual</text></g>
<g class="a-ap" style="--d:1.50s"><circle cx="620" cy="150" r="40" fill="#fff" stroke="#E07A2E" stroke-width="5"/><circle cx="609" cy="142" r="4.5" fill="#E07A2E"/><circle cx="631" cy="142" r="4.5" fill="#E07A2E"/><path d="M -12 15 Q 0 7 12 15" transform="translate(620 150)" stroke="#E07A2E" stroke-width="5" fill="none" stroke-linecap="round"/><text x="620" y="230" font-size="24" font-weight="800" fill="#E07A2E" text-anchor="middle">don't like</text><text x="620" y="258" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">no me gusta</text></g>
<g class="a-ap" style="--d:1.90s"><circle cx="790" cy="150" r="40" fill="#fff" stroke="#4A4870" stroke-width="5"/><circle cx="779" cy="142" r="4.5" fill="#4A4870"/><circle cx="801" cy="142" r="4.5" fill="#4A4870"/><path d="M -14 18 Q 0 4 14 18" transform="translate(790 150)" stroke="#4A4870" stroke-width="5" fill="none" stroke-linecap="round"/><text x="790" y="230" font-size="24" font-weight="800" fill="#4A4870" text-anchor="middle">hate</text><text x="790" y="258" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">odio</text></g>
<g class="a-ap" style="--d:2.4s"><path d="M 70 300 H 830" stroke="#4A4870" stroke-width="3" marker-end="url(#pt)"/><text x="450" y="330" font-size="17" font-weight="600" fill="#4A4870" text-anchor="middle">de lo que más te gusta a lo que menos · después va el verbo con -ing: I love playing</text></g>
