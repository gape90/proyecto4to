<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 660" role="img" aria-label="Escala de gustos con cinco caras: love, me encanta; like, me gusta; don't mind, me da igual; don't like, no me gusta; hate, odio" font-family="'Plus Jakarta Sans', system-ui, sans-serif">
<rect x="0" y="0" width="500" height="660" rx="28" fill="#F7F4FD"/>
<defs><marker id="pt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#4A4870"/></marker></defs>
<text x="250.0" y="52" font-size="26" font-weight="800" fill="#5B2A86" text-anchor="middle">¿Cuánto te gusta?</text>
<g class="a-ap" style="--d:0.30s"><circle cx="80" cy="110" r="34" fill="#fff" stroke="#5B2A86" stroke-width="5"/><circle cx="69" cy="102" r="4.5" fill="#5B2A86"/><circle cx="91" cy="102" r="4.5" fill="#5B2A86"/><path d="M -14 8 Q 0 24 14 8" transform="translate(80 110)" stroke="#5B2A86" stroke-width="5" fill="none" stroke-linecap="round"/><text x="140" y="108" font-size="26" font-weight="800" fill="#5B2A86">love</text><text x="140" y="136" font-size="19" font-weight="600" fill="#4A4870">me encanta</text></g>
<g class="a-ap" style="--d:0.70s"><circle cx="80" cy="210" r="34" fill="#fff" stroke="#4B4FA3" stroke-width="5"/><circle cx="69" cy="202" r="4.5" fill="#4B4FA3"/><circle cx="91" cy="202" r="4.5" fill="#4B4FA3"/><path d="M -12 10 Q 0 18 12 10" transform="translate(80 210)" stroke="#4B4FA3" stroke-width="5" fill="none" stroke-linecap="round"/><text x="140" y="208" font-size="26" font-weight="800" fill="#4B4FA3">like</text><text x="140" y="236" font-size="19" font-weight="600" fill="#4A4870">me gusta</text></g>
<g class="a-ap" style="--d:1.10s"><circle cx="80" cy="310" r="34" fill="#fff" stroke="#B83A7A" stroke-width="5"/><circle cx="69" cy="302" r="4.5" fill="#B83A7A"/><circle cx="91" cy="302" r="4.5" fill="#B83A7A"/><path d="M -12 12 L 12 12" transform="translate(80 310)" stroke="#B83A7A" stroke-width="5" fill="none" stroke-linecap="round"/><text x="140" y="308" font-size="26" font-weight="800" fill="#B83A7A">don't mind</text><text x="140" y="336" font-size="19" font-weight="600" fill="#4A4870">me da igual</text></g>
<g class="a-ap" style="--d:1.50s"><circle cx="80" cy="410" r="34" fill="#fff" stroke="#E07A2E" stroke-width="5"/><circle cx="69" cy="402" r="4.5" fill="#E07A2E"/><circle cx="91" cy="402" r="4.5" fill="#E07A2E"/><path d="M -12 15 Q 0 7 12 15" transform="translate(80 410)" stroke="#E07A2E" stroke-width="5" fill="none" stroke-linecap="round"/><text x="140" y="408" font-size="26" font-weight="800" fill="#E07A2E">don't like</text><text x="140" y="436" font-size="19" font-weight="600" fill="#4A4870">no me gusta</text></g>
<g class="a-ap" style="--d:1.90s"><circle cx="80" cy="510" r="34" fill="#fff" stroke="#4A4870" stroke-width="5"/><circle cx="69" cy="502" r="4.5" fill="#4A4870"/><circle cx="91" cy="502" r="4.5" fill="#4A4870"/><path d="M -14 18 Q 0 4 14 18" transform="translate(80 510)" stroke="#4A4870" stroke-width="5" fill="none" stroke-linecap="round"/><text x="140" y="508" font-size="26" font-weight="800" fill="#4A4870">hate</text><text x="140" y="536" font-size="19" font-weight="600" fill="#4A4870">odio</text></g>
<g class="a-ap" style="--d:2.4s"><text x="250" y="600" font-size="18" font-weight="600" fill="#4A4870" text-anchor="middle">Después va el verbo con -ing:</text><text x="250" y="628" font-size="20" font-weight="800" fill="#5B2A86" text-anchor="middle">I love playing.</text></g>
</svg>
