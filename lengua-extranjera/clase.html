<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Clase · Acompañamiento Pedagógico</title>
<link rel="stylesheet" href="css/potenciar.css">
</head>
<body>
<div id="cab"></div>
<main class="contenedor"><div id="clase"><p class="ayuda">Cargando la clase…</p></div></main>
<script type="module">
import { montarAsistente } from './js/asistente.js';
import { cargarJSON, cabecera, esc, leer } from './js/estado.js';
import { montarClase } from './js/motor.js';
import { usaPersonajes, personajeDe, personalizar, vozDelPersonaje } from './js/personajes.js';

document.getElementById('cab').innerHTML = cabecera({ volver: { href: 'recorrido.html', texto: 'Mi recorrido' } });
const id = new URLSearchParams(location.search).get('c');
try {
  if (!/^[a-z0-9-]+$/.test(id || '')) throw new Error('Clase no válida');
  let clase = await cargarJSON(`contenidos/clases/${id}.json`);
  // Inglés: la clase se arma con el personaje elegido; si todavía no eligió, primero elige
  let pj = null;
  if (usaPersonajes(clase)) {
    pj = await personajeDe(leer());
    if (!pj) { location.replace('index.html?cambiar=1'); throw new Error('Primero elegí tu personaje.'); }
    clase = personalizar(clase, pj); vozDelPersonaje(pj);
  }
  document.title = `${clase.titulo} · Acompañamiento Pedagógico`;
  montarClase(document.getElementById('clase'), clase, { personaje: pj });
} catch (err) {
  document.getElementById('clase').innerHTML = `<div class="tarjeta"><b>No se pudo abrir la clase.</b><br>${esc(err.message)}<br><a href="recorrido.html">Volver a mi recorrido</a></div>`;
}
montarAsistente();
</script>
</body>
</html>
