<g class="a-ap" style="--d:0.65s"><rect x="560" y="181" width="370" height="78" rx="16" fill="#fff" stroke="#B9AEDB" stroke-width="3"/><circle cx="592" cy="220" r="17" fill="#B9AEDB"/><text x="592" y="226" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">2</text><text x="622" y="213" font-size="18" font-weight="800" fill="#1B1A4A">Se difunde</text><text x="622" y="239" font-size="14.5" fill="#4A4870">Redes sociales y medios lo hacen conocer.</text></g>
<g class="a-ap" style="--d:1.20s"><rect x="560" y="276" width="370" height="78" rx="16" fill="#fff" stroke="#4B4FA3" stroke-width="3"/><circle cx="592" cy="315" r="17" fill="#4B4FA3"/><text x="592" y="321" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">3</text><text x="622" y="308" font-size="18" font-weight="800" fill="#1B1A4A">Se suman otros lugares</text><text x="622" y="334" font-size="14.5" fill="#4A4870">Se organizan en otras ciudades y países.</text></g>
<g class="a-ap" style="--d:1.75s"><rect x="560" y="371" width="370" height="78" rx="16" fill="#fff" stroke="#F0731E" stroke-width="3"/><circle cx="592" cy="410" r="17" fill="#F0731E"/><text x="592" y="416" text-anchor="middle" font-size="17" font-weight="800" fill="#fff">4</text><text x="622" y="403" font-size="18" font-weight="800" fill="#1B1A4A">Jornadas mundiales</text><text x="622" y="429" font-size="14.5" fill="#4A4870">El mismo día, en muchos lugares.</text></g>
</svg>