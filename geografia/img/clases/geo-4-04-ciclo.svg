<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-label="Ciclo de la desertización en seis pasos que vuelven al comienzo: se tala y se pastorea más de lo que la tierra repone; queda menos vegetación; el suelo queda desnudo; el viento y la lluvia se llevan el suelo; el suelo pierde fertilidad; se produce menos y se presiona más la tierra." font-family="'Plus Jakarta Sans', system-ui, sans-serif">
