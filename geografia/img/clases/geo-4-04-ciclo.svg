<g class="a-ap" style="--d:0.35s"><rect x="332.0" y="79.0" width="236" height="72" rx="18" fill="#fff" stroke="#5B2A86" stroke-width="3"/><text x="450.0" y="110.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1B1A4A">Se tala y se pastorea más</text><text x="450.0" y="133.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1B1A4A">de lo que la tierra repone</text></g>
<g class="a-ap" style="--d:0.75s"><rect x="583.4" y="186.5" width="236" height="72" rx="18" fill="#fff" stroke="#4B4FA3" stroke-width="3"/><text x="701.4" y="217.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1B1A4A">Queda menos</text><text x="701.4" y="240.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1B1A4A">vegetación</text></g>
<g class="a-ap" style="--d:1.15s"><rect x="583.4" y="401.5" width="236" height="72" rx="18" fill="#fff" stroke="#B83A7A" stroke-width="3"/><text x="701.4" y="432.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1B1A4A">El suelo queda</text><text x="701.4" y="455.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1B1A4A">desnudo</text></g>
<g class="a-ap" style="--d:1.55s"><rect x="332.0" y="509.0" width="236" height="72" rx="18" fill="#fff" stroke="#E5194F" stroke-width="3"/><text x="450.0" y="540.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1B1A4A">El viento y la lluvia</text><text x="450.0" y="563.0" text-anchor="middle" font-size="17" font-weight="700" fill="#1B1A4A">se llevan el suelo</text></g>
<g class="a-ap" style="--d:1.95s"><rect x="80.6" y="401.5" width="236" height="72" rx="18" fill="#fff" stroke="#F0731E" stroke-width="3"/><text x="198.6" y="432.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1B1A4A">El suelo pierde</text><text x="198.6" y="455.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1B1A4A">fertilidad</text></g>
<g class="a-ap" style="--d:2.35s"><rect x="80.6" y="186.5" width="236" height="72" rx="18" fill="#fff" stroke="#5B2A86" stroke-width="3"/><text x="198.6" y="217.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1B1A4A">Se produce menos</text><text x="198.6" y="240.5" text-anchor="middle" font-size="17" font-weight="700" fill="#1B1A4A">y se presiona más la tierra</text></g>
</svg>