<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acompañamiento Pedagógico · Aulas</title>
<style>
@font-face{font-family:'Plus Jakarta Sans';font-weight:400;font-display:swap;src:url('historia/fonts/plus-jakarta-sans-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-weight:600;font-display:swap;src:url('historia/fonts/plus-jakarta-sans-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-weight:800;font-display:swap;src:url('historia/fonts/plus-jakarta-sans-latin-800-normal.woff2') format('woff2')}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#F7F4FD;color:#1B1A4A;min-height:100vh}
header{background:linear-gradient(135deg,#4B4FA3 0%,#B83A7A 30%,#E5194F 58%,#F0731E 100%);color:#fff;padding:48px 20px 64px;text-align:center;position:relative;overflow:hidden}
header::after{content:"";position:absolute;inset:auto -10% -60px;height:120px;background:#F7F4FD;border-radius:50% 50% 0 0}
header h1{margin:0 0 8px;font-size:clamp(1.6rem,4.5vw,2.4rem);font-weight:800;animation:baja .5s ease-out both}
header p{margin:0;opacity:.92;animation:baja .5s .08s ease-out both}
main{max-width:820px;margin:-20px auto 40px;padding:0 16px;position:relative}
.grilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.aula{--c:#4B4FA3;position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;background:#fff;border-radius:22px;padding:18px 18px 18px 16px;text-decoration:none;color:inherit;
  box-shadow:0 2px 4px rgba(27,26,74,.05),0 12px 28px rgba(75,79,163,.12);border:2px solid transparent;
  opacity:0;animation:entra .45s cubic-bezier(.2,.8,.3,1.2) calc(.15s + var(--i)*.07s) forwards;
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;-webkit-tap-highlight-color:transparent}
.aula::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.icono{flex:none;width:60px;height:60px;border-radius:18px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 13%,#fff);transition:transform .25s ease,background .25s ease,color .25s ease}
.icono svg{width:36px;height:36px}
.texto{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.nombre{font-weight:800;font-size:1.08rem;line-height:1.2}
.cant{align-self:flex-start;font-size:.8rem;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);border-radius:99px;padding:3px 10px}
.ir{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 10%,#fff);transition:transform .2s ease,background .2s,color .2s}
.ir svg{width:20px;height:20px}
.aula:hover,.aula:focus-visible{transform:translateY(-4px);border-color:var(--c);box-shadow:0 4px 8px rgba(27,26,74,.06),0 18px 36px color-mix(in srgb,var(--c) 28%,transparent);outline:none}
.aula:hover .icono,.aula:focus-visible .icono{transform:rotate(-6deg) scale(1.06);background:var(--c);color:#fff}
.aula:hover .ir,.aula:focus-visible .ir{transform:translateX(4px);background:var(--c);color:#fff}
.aula:active{transform:scale(.97);transition-duration:.08s}
.onda{position:absolute;border-radius:50%;background:var(--c);opacity:.22;transform:scale(0);pointer-events:none;animation:onda .45s ease-out forwards}
.aula.elegida{border-color:var(--c);transform:scale(.97)}
.aula.elegida .ir{background:var(--c);color:#fff;animation:sale .35s ease-in forwards}
.nota{margin-top:24px;font-size:.88rem;color:#4A4870;text-align:center;opacity:0;animation:baja .4s .7s ease-out forwards}
@keyframes entra{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes baja{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes onda{to{transform:scale(2.6);opacity:0}}
@keyframes sale{to{transform:translateX(14px);opacity:0}}
@media (max-width:420px){.grilla{grid-template-columns:1fr}.icono{width:52px;height:52px}.icono svg{width:30px;height:30px}}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}.aula,.nota{opacity:1}}
</style>
</head>
<body>
<header>
  <h1>Acompañamiento Pedagógico</h1>
  <p>4.º año · Elegí un aula</p>
</header>
<main>
  <nav class="grilla" aria-label="Aulas">
    <a class="aula" href="biologia/index.html?cambiar=1&inicio=1" style="--c:#1F9D72;--i:0">
      <span class="icono"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="15" fill="none" stroke="currentColor" stroke-width="3"/><ellipse cx="20" cy="21" rx="6" ry="5" fill="currentColor" opacity=".9"/><circle cx="31" cy="30" r="2.5" fill="currentColor"/><circle cx="29" cy="15" r="1.8" fill="currentColor"/></svg></span>
      <span class="texto"><span class="nombre">Biología</span><span class="cant">7 clases</span></span>
      <span class="ir" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>
    <a class="aula" href="historia/index.html?cambiar=1&inicio=1" style="--c:#B8662A;--i:1">
      <span class="icono"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M14 12h20v6H14zM16 18v18M24 18v18M32 18v18M12 36h24v4H12z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg></span>
      <span class="texto"><span class="nombre">Historia</span><span class="cant">9 clases</span></span>
      <span class="ir" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>
    <a class="aula" href="geografia/index.html?cambiar=1&inicio=1" style="--c:#2C7DB5;--i:2">
      <span class="icono"><svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="15" fill="none" stroke="currentColor" stroke-width="3"/><path d="M9 24h30M24 9c-6 7-6 23 0 30M24 9c6 7 6 23 0 30" fill="none" stroke="currentColor" stroke-width="2.5"/></svg></span>
      <span class="texto"><span class="nombre">Geografía</span><span class="cant">12 clases</span></span>
      <span class="ir" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>
    <a class="aula" href="matematica/index.html?cambiar=1&inicio=1" style="--c:#4B4FA3;--i:3">
      <span class="icono"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M14 16h10M19 11v10M28 16h8M14 32l8-0M14 32h0M30 28l6 8M36 28l-6 8M14 30h10M14 34h10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></span>
      <span class="texto"><span class="nombre">Matemática</span><span class="cant">10 clases</span></span>
      <span class="ir" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>
    <a class="aula" href="lengua/index.html?cambiar=1&inicio=1" style="--c:#B83A7A;--i:4">
      <span class="icono"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M10 14c5-2 10-2 14 1v22c-4-3-9-3-14-1zM38 14c-5-2-10-2-14 1v22c4-3 9-3 14-1z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/></svg></span>
      <span class="texto"><span class="nombre">Lengua y Literatura</span><span class="cant">13 clases</span></span>
      <span class="ir" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>
    <a class="aula" href="lengua-extranjera/index.html?cambiar=1&inicio=1" style="--c:#E5194F;--i:5">
      <span class="icono"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M10 12h20a4 4 0 0 1 4 4v10a4 4 0 0 1-4 4H18l-6 5v-5h-2a4 4 0 0 1-4-4V16a4 4 0 0 1 4-4z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><text x="20" y="25.5" text-anchor="middle" font-size="9" font-weight="800" fill="currentColor" font-family="Plus Jakarta Sans,sans-serif">EN</text></svg></span>
      <span class="texto"><span class="nombre">Lengua Extranjera Inglés</span><span class="cant">8 clases</span></span>
      <span class="ir" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>
  </nav>
  <p class="nota">Versión de prueba: en todas las aulas se puede avanzar sin resolver las actividades.</p>
</main>
<script>
const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
document.querySelectorAll('.aula').forEach(a => a.addEventListener('click', ev => {
  if (quieto || ev.ctrlKey || ev.metaKey || ev.shiftKey || ev.button) return;
  ev.preventDefault();
  const r = a.getBoundingClientRect(), d = Math.max(r.width, r.height), o = document.createElement('span');
  o.className = 'onda'; o.style.cssText = `width:${d}px;height:${d}px;left:${(ev.clientX || r.left + r.width/2) - r.left - d/2}px;top:${(ev.clientY || r.top + r.height/2) - r.top - d/2}px`;
  a.appendChild(o); a.classList.add('elegida');
  setTimeout(() => { location.href = a.href; }, 380);
}));
addEventListener('pageshow', e => { if (e.persisted) document.querySelectorAll('.elegida').forEach(a => a.classList.remove('elegida')); });
</script>
</body>
</html>
