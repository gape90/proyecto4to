<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acompañamiento Pedagógico · Aulas</title>
<style>
@font-face{font-family:'Plus Jakarta Sans';font-weight:400;font-display:swap;src:url('historia/fonts/plus-jakarta-sans-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-weight:600;font-display:swap;src:url('historia/fonts/plus-jakarta-sans-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Plus Jakarta Sans';font-weight:800;font-display:swap;src:url('historia/fonts/plus-jakarta-sans-latin-800-normal.woff2') format('woff2')}
*{box-sizing:border-box}
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#F7F4FD;color:#1B1A4A;min-height:100vh}
header{background:linear-gradient(135deg,#4B4FA3 0%,#B83A7A 30%,#E5194F 58%,#F0731E 100%);color:#fff;padding:44px 20px 52px;text-align:center}
header h1{margin:0 0 8px;font-size:clamp(1.6rem,4.5vw,2.4rem);font-weight:800}
header p{margin:0;opacity:.92}
main{max-width:760px;margin:-26px auto 40px;padding:0 16px}
.grilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.aula{display:flex;align-items:center;gap:12px;background:#fff;border-radius:20px;padding:22px 20px;text-decoration:none;color:inherit;box-shadow:0 10px 30px rgba(75,79,163,.14);border:2px solid transparent;transition:transform .15s,border-color .15s}
.aula:hover,.aula:focus-visible{transform:translateY(-3px);border-color:#B83A7A;outline:none}
.nombre{font-weight:800;font-size:1.1rem;flex:1}
.cant{font-size:.85rem;color:#4A4870;background:#EFEAFB;border-radius:99px;padding:4px 10px}
.ir{font-weight:800;color:#E5194F}
.nota{margin-top:22px;font-size:.88rem;color:#4A4870;text-align:center}
@media (prefers-reduced-motion:reduce){.aula{transition:none}}
</style>
</head>
<body>
<header>
  <h1>Acompañamiento Pedagógico</h1>
  <p>4.º año · Elegí un aula</p>
</header>
<main>
  <nav class="grilla" aria-label="Aulas">
    <a class="aula" href="historia/index.html?cambiar=1&inicio=1"><span class="nombre">Historia</span><span class="cant">9 clases</span><span class="ir" aria-hidden="true">→</span></a>
    <a class="aula" href="geografia/index.html?cambiar=1&inicio=1"><span class="nombre">Geografía</span><span class="cant">12 clases</span><span class="ir" aria-hidden="true">→</span></a>
    <a class="aula" href="matematica/index.html?cambiar=1&inicio=1"><span class="nombre">Matemática</span><span class="cant">10 clases</span><span class="ir" aria-hidden="true">→</span></a>
    <a class="aula" href="lengua/index.html?cambiar=1&inicio=1"><span class="nombre">Lengua y Literatura</span><span class="cant">13 clases</span><span class="ir" aria-hidden="true">→</span></a>
    <a class="aula" href="lengua-extranjera/index.html?cambiar=1&inicio=1"><span class="nombre">Lengua Extranjera Inglés</span><span class="cant">8 clases</span><span class="ir" aria-hidden="true">→</span></a>
    <a class="aula" href="biologia/index.html?cambiar=1&inicio=1"><span class="nombre">Biología</span><span class="cant">7 clases</span><span class="ir" aria-hidden="true">→</span></a>
  </nav>
  <p class="nota">Versión de prueba: en todas las aulas se puede avanzar sin resolver las actividades.</p>
</main>
</body>
</html>
